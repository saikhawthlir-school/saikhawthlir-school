<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - SKT School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --bg: #f0f2f5; --card: white; --text: #050505; }
    body.dark { --bg: #18191a; --card: #242526; --text: #e4e6eb; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial; }
    body { background: var(--bg); color: var(--text); display:flex; justify-content:center; align-items:center; height:100vh }
    .box { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); width: 90%; max-width: 400px }
    .box h2 { text-align:center; color:#1877f2; margin-bottom:20px; font-size:32px }
    .box input { width:100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; font-size:16px; background:var(--bg); color:var(--text) }
    .box button { width:100%; padding: 14px; border-radius: 8px; border:none; background:#1877f2; color:white; font-size:18px; font-weight:bold; cursor:pointer }
    .box p { text-align:center; margin-top:15px; font-size:14px }
    .box a { color:#1877f2; text-decoration:none; font-weight:bold }
  </style>
</head>
<body>
  <div class="box">
    <h2>SKT School</h2>
    <input type="text" id="name" placeholder="I hming pum">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signupBtn">Sign Up</button>
    <p>Account i nei tawh? <a href="login.html">Login rawh</a></p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
    authDomain: "school-project-dab29.firebaseapp.com",
    projectId: "school-project-dab29"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  if(localStorage.getItem('dark') === 'true') document.body.classList.add('dark');

  document.getElementById('signupBtn').onclick = async () => {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if(!name || !email || !password) return alert("Khawngaihin fill kim rawh");

    try {
      // 1. Auth ah user siam
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // 2. DisplayName set
      await updateProfile(user, { displayName: name });

      // 3. FIRESTORE AH USERS COLLECTION AH DAH - HEI HI A PAWIMAWH
      await setDoc(doc(db, "users", user.uid), {
        name: name,
        email: email,
        uid: user.uid,
        friends: [],     // thiante list ruak
        requests: []     // friend request dawn list ruak
      });

      alert("Account i siam hlawhtling e");
      window.location.href = "feed.html";

    } catch (error) {
      alert(error.message);
    }
  }
</script>
</body>
</html>

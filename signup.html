<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - SKT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0 }
   .box { background:white; padding:30px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.2); width:300px }
    input { width: 93%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: #42b72a; color: white; border: none; border-radius: 5px; font-weight: bold; font-size:16px; cursor:pointer }
    a { text-align:center; display:block; margin-top:10px; color:#1877f2; text-decoration:none }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="text-align:center">Sign Up</h2>
    <input type="text" id="name" placeholder="I hming">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button id="signupBtn">Create Account</button>
    <a href="login.html">Login na ah let</a>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
    authDomain: "school-project-dab29.firebaseapp.com",
    projectId: "school-project-dab29"
  });
  const auth = getAuth(app);

  document.getElementById('signupBtn').onclick = async () => {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    
    if(name === "" || email === "" || pass === "") return alert("Kim lo a awm");

    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      // Hei hi a pawimawh: Hming hi Firebase ah kan dah nghal
      await updateProfile(userCred.user, { displayName: name });
      alert("Account siam a hlawhtling!");
      window.location.href = "feed.html";
    } catch(e) {
      alert("Error: " + e.message);
    }
  }
</script>
</body>
</html>

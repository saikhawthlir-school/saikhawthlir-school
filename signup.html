<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MizoChat - Register</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: Roboto, "Segoe UI", sans-serif;
    background: #FFFFFF;
    padding: 40px 16px 0;
  }
  
  .logo-wrap{ 
    display:flex; 
    align-items:flex-start;
    gap:12px; 
    margin-bottom:20px;
  }
  .logo{ 
    width:48px; height:48px; border-radius:12px;
    background: linear-gradient(135deg,#25D366,#128C7E);
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:800; font-size:18px; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink:0;
  }
  h1{ font-size:24px; margin:0; font-weight:700; color:#000; line-height:1.2; }
  .sub{ color:#333; font-size:15px; line-height:1.4; margin-top:2px; }

  .info{ font-size:15px; color:#000; margin:0 0 18px; }
  .info b{ font-weight:700; }

  .field{ margin-bottom:14px; }
  .input{
    width:100%; padding:14px; border:1.5px solid #ddd; 
    font-size:16px; background:white; outline:none;
    border-radius:10px;
  }
  .input:focus{ border-color: #128C7E; }

  .pw-wrap{ position:relative; }
  .eye{ 
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:20px; color:#999;
    user-select: none;
  }

  .btn{
    width:100%; padding:14px; border:none; border-radius:12px;
    background: linear-gradient(135deg,#25D366,#128C7E);
    color:white; font-size:17px; font-weight:700; cursor:pointer;
    box-shadow: 0 3px 8px rgba(18,140,126,0.3); 
    margin-top:8px;
  }

  .divider{ height:1px; background:#e5e5e5; margin:18px 0; }

  .login-link{ text-align:center; font-size:15px; color:#222; }
  .login-link a{ color:#128C7E; font-weight:700; text-decoration:none; }

  /* CUSTOM POPUP CSS */
  .popup-overlay{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    display:none; align-items:center; justify-content:center;
    z-index:9999;
  }
  .popup-box{
    background:white; padding:24px; border-radius:16px;
    width:85%; max-width:320px; text-align:center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: popupIn 0.3s;
  }
  @keyframes popupIn{ from{transform:scale(0.8); opacity:0;} to{transform:scale(1); opacity:1;} }
  .popup-box h3{ font-size:18px; margin-bottom:10px; color:#000; }
  .popup-box p{ font-size:15px; color:#444; margin-bottom:20px; }
  .popup-btn{
    background: linear-gradient(135deg,#25D366,#128C7E);
    color:white; border:none; padding:10px 24px;
    border-radius:10px; font-weight:700; cursor:pointer;
    font-size:15px;
  }

</style>
</head>
<body>

<div class="logo-wrap">
  <div class="logo">MC</div>
  <div>
    <h1>Create Account</h1>
    <div class="sub">Join <b>MizoChat</b> Today</div>
  </div>
</div>

<div class="info">Fill in your details to <b>Register</b></div>

<div class="field">
  <input id="name" class="input" type="text" placeholder="Full Name *">
</div>

<div class="field">
  <input id="email" class="input" type="email" placeholder="Email ID *">
</div>

<div class="field pw-wrap">
  <input id="pass" class="input" type="password" placeholder="Password *">
  <span class="eye" onclick="togglePass('pass', this)">👁️</span>
</div>

<div class="field pw-wrap">
  <input id="cpass" class="input" type="password" placeholder="Confirm Password *">
  <span class="eye" onclick="togglePass('cpass', this)">👁️</span>
</div>

<button class="btn" onclick="register()">Register</button>

<div class="divider"></div>

<div class="login-link">
  Already have an account? <a href="index.html">Login Now</a>
</div>

<!-- CUSTOM POPUP HTML -->
<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <h3 id="popup-title">Alert</h3>
    <p id="popup-msg"></p>
    <button class="popup-btn" onclick="closePopup()">OK</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
// VERCEL ENV ATANGA A LO LAK DAN - %% HMANG
const firebaseConfig = { 
  apiKey: "%VITE_FIREBASE_API_KEY%", 
  authDomain: "%VITE_FIREBASE_AUTH_DOMAIN%", 
  projectId: "%VITE_FIREBASE_PROJECT_ID%",
  storageBucket: "%VITE_FIREBASE_STORAGE_BUCKET%",
  messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
  appId: "%VITE_FIREBASE_APP_ID%"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function togglePass(id, el){
  const p = document.getElementById(id);
  if(p.type==='password'){ 
    p.type='text'; 
    el.textContent = '🙈'; 
  } else { 
    p.type='password'; 
    el.textContent = '👁️'; 
  }
}

// CUSTOM POPUP FUNCTION
function showPopup(title, msg){
  document.getElementById('popup-title').innerText = title;
  document.getElementById('popup-msg').innerText = msg;
  document.getElementById('popup').style.display = 'flex';
}
function closePopup(){
  document.getElementById('popup').style.display = 'none';
}

function register(){
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const cpass = document.getElementById('cpass').value;

  if(!name || !email || !pass || !cpass){
    showPopup("Error", "Field zawng zawng fill rawh");
    return;
  }
  if(pass !== cpass){
    showPopup("Error", "Password a inang lo");
    return;
  }
  if(pass.length < 6){
    showPopup("Error", "Password chu 6 character aia tam tur");
    return;
  }

  auth.createUserWithEmailAndPassword(email, pass)
    .then((userCredential)=> {
      return userCredential.user.updateProfile({displayName: name})
    })
    .then(()=> {
      showPopup("Success", "Account siam a hlawhtling e!");
      setTimeout(()=> location.href="index.html", 1500);
    })
    .catch(e=> showPopup("Error", e.message));
}
</script>
</body>
</html>

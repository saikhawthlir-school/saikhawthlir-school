<!DOCTYPE html>
<html>
<head>
  <title>SKT Connect Login</title>
  <style>
    body{background:#1E88E5;display:flex;justify-content:center;align-items:center;height:100vh}
    .box{background:white;padding:30px;border-radius:10px;width:300px}
    input,button{width:100%;padding:10px;margin:10px 0;border-radius:5px;border:1px solid #ccc}
    button{background:#1E88E5;color:white;border:none}
  </style>
</head>
<body>
  <div class="box">
    <h2>🔵 SKT Connect</h2>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  // I firebaseConfig kha he tah dah rawh
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signup = () => {
  createUserWithEmailAndPassword(auth, email.value, pass.value)
  .then(() => window.location = 'feed.html')
  .catch(e => alert(e.message));
}

window.login = () => {
  signInWithEmailAndPassword(auth, email.value, pass.value)
  .then(() => window.location = 'feed.html')
  .catch(e => alert(e.message));
}
</script>
</body>
</html>

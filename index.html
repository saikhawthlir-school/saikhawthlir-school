<script>
const searchInput = document.getElementById('searchInput');
const searchableElements = document.querySelectorAll('.content h1, .content h2, .content h3, .content p, .content li');

searchInput.addEventListener('keyup', function() {
  let filter = searchInput.value.toLowerCase();

  // a hma a eng zawng remove phawt
  searchableElements.forEach(el => {
    el.classList.remove('highlight');
  });

  if(filter.length > 2){ // 2 character a pelh chuan chiah search
    searchableElements.forEach(el => {
      let txtValue = el.textContent.toLowerCase();
      if (txtValue.includes(filter)) {
        el.classList.add('highlight'); // yellow class pe
      }
    });
  }
});
</script>

</body>

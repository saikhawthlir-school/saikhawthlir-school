<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKT Chat</title>
<style>
    * { box-sizing: border-box; }
  body { font-family: Arial; margin:0; background:#0f172a; color:white; padding-bottom:70px; }
  .header { background:#22c55e; padding:12px; font-size:18px; font-weight:bold; position:sticky; top:0; }
  .tabs { display:flex; background:#16a34a; position:sticky; top:48px; }
  .tab { flex:1; text-align:center; padding:12px; cursor:pointer; font-weight:bold; }
  .tab.active { border-bottom:3px solid white; background:#15803d; }
  .page { display:none; padding:10px; }
  .page.active { display:block; }
  .msg { background:#1e293b; padding:10px; margin:6px 0; border-radius:10px; word-wrap:break-word; }
  .bottom { 
    position:fixed; 
    bottom:0; 
    left:0;
    width:100%; 
    background:#1e293b; 
    padding:10px; 
    display:flex; 
    gap:5px;
    border-top:1px solid #334155;
  }
  input { flex:1; padding:12px; border-radius:8px; border:none; background:#334155; color:white; outline:none; }
  button { padding:12px 18px; background:#22c55e; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  #loginPage { text-align:center; margin-top:100px; }
</style>
</head>
<body>

<div id="loginPage">
  <h2>SKT Chat</h2>
  <p>Anonymous a lut rawh</p>
  <button onclick="login()">Lut rawh</button>
</div>

<div id="app" style="display:none;">
  <div class="header">SKT Chat</div>
  
  <div class="tabs">
    <div class="tab active" onclick="showTab('chats', this)">CHATS</div>
    <div class="tab" onclick="showTab('users', this)">USERS</div>
    <div class="tab" onclick="showTab('status', this)">STATUS</div>
  </div>

  <div id="chats" class="page active">
    <div id="chatList">Loading...</div>
    <div class="bottom">
      <input id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>

  <div id="users" class="page">
    <div id="userList">Loading...</div>
  </div>

  <div id="status" class="page">
    <div id="statusList">Loading...</div>
    <div class="bottom">
      <input id="statusInput" placeholder="Update status..." onkeypress="if(event.key==='Enter') updateStatus()">
      <button onclick="updateStatus()">Post</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// I FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
  authDomain: "school-project-dab29.firebaseapp.com",
  databaseURL: "https://school-project-dab29-default-rtdb.firebaseio.com",
  projectId: "school-project-dab29",
  storageBucket: "school-project-dab29.firebasestorage.app",
  messagingSenderId: "214125475324",
  appId: "1:214125475324:web:83f908e4476ef8be3c2e79",
  measurementId: "G-EGCH5X2Q91"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// LOGIN
function login(){
  firebase.auth().signInAnonymously().catch(e=>alert("Error: "+e.message));
}

firebase.auth().onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="block";
    saveUser(user.uid);
    loadChats();
    loadUsers();
    loadStatus();
  }
});

// TAB
function showTab(id, el){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  el.classList.add("active");
}

// SAVE USER
function saveUser(uid){
  db.collection("users").doc(uid).set({lastSeen: Date.now()});
}

// CHAT
function loadChats(){
  db.collection("chats").orderBy("time").onSnapshot(snap=>{
    let html="";
    snap.forEach(d=>{ html+=`<div class="msg">${d.data().text}</div>` });
    document.getElementById("chatList").innerHTML = html || "Message la awm lo";
  });
}
function sendMsg(){
  let txt = document.getElementById("msgInput").value.trim();
  if(txt){
    db.collection("chats").add({text:txt, time:Date.now()});
    document.getElementById("msgInput").value="";
  }
}

// USERS
function loadUsers(){
  db.collection("users").onSnapshot(snap=>{
    let html="";
    snap.forEach(d=>{ html+=`<div class="msg">User: ${d.id.substring(0,8)}</div>` });
    document.getElementById("userList").innerHTML = html || "User la awm lo";
  });
}

// STATUS
function loadStatus(){
  db.collection("status").orderBy("time","desc").onSnapshot(snap=>{
    let html="";
    snap.forEach(d=>{ html+=`<div class="msg">${d.data().text}</div>` });
    document.getElementById("statusList").innerHTML = html || "Status la awm lo";
  });
}
function updateStatus(){
  let txt = document.getElementById("statusInput").value.trim();
  if(txt){
    db.collection("status").add({text:txt, time:Date.now()});
    document.getElementById("statusInput").value="";
  }
}
</script>
</body>
</html>

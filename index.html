<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MizoChat - Login</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background: #FFFFFF;
    padding: 16px; /* sir leh chung ah 16px chiah */
  }
  
  .container{ width:100%; }
  
  .logo-wrap{ 
    display:flex; 
    align-items:center; 
    gap:10px; 
    margin-bottom:12px; /* 20px atangin 12px ah */
  }
  .logo{ 
    width:44px; height:44px; border-radius:12px;
    background: linear-gradient(135deg,#25D366,#128C7E);
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:800; font-size:20px;
  }
  h1{ font-size:24px; margin:0; font-weight:700; }
  .sub{ color:#555; margin:2px 0 0; font-size:14px; } /* margin kan ti tlem */

  .info{ font-size:14px; font-weight:600; color:#000; margin:16px 0 10px; } /* 24px atangin 16px */

  .label{ font-size:13px; font-weight:600; color:#222; margin:10px 0 4px; display:block; } /* 14px/6px atangin 10px/4px */
  .input{
    width:100%; padding:12px; border:1.5px solid #ccc; border-radius:10px; /* 14px atangin 12px */
    font-size:15px; background:white;
  }

  .pw-wrap{ position:relative; }
  .eye{ 
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:18px; color:#888;
  }

  .forgot{ display:inline-block; margin:6px 0 12px; color:#FF6A00; text-decoration:none; font-weight:600; font-size:13px; } /* 8px/18px atangin 6px/12px */

  .btn{
    width:100%; padding:13px; border:none; border-radius:12px; /* 15px atangin 13px */
    background:#FF6A00; color:white; font-size:16px; font-weight:700; cursor:pointer;
  }

  .divider{ height:1px; background:#e0e0e0; margin:14px 0; } /* 20px atangin 14px */

  .register{ text-align:center; font-size:14px; color:#222; }

</style>
</head>
<body>

<div class="container">
  <div class="logo-wrap">
    <div class="logo">MC</div>
    <div>
      <h1>Welcome!</h1>
      <div class="sub">Login to your <b>MizoChat</b> Account</div>
    </div>
  </div>

  <div class="info">Login using your <b>Mobile/Email ID and Password</b></div>
  
  <label class="label">Mobile/Email ID *</label>
  <input id="email" class="input" type="text" placeholder="7005697815 or you@email.com">

  <label class="label">Password *</label>
  <div class="pw-wrap">
    <input id="pass" class="input" type="password" placeholder="Password">
    <span class="eye" onclick="togglePass()">👁️</span>
  </div>

  <a href="#" class="forgot">Forgot Password?</a>

  <button class="btn" onclick="login()">Login</button>

  <div class="divider"></div>

  <div class="register">
    Don't have a MizoChat Account? <a href="#">Register Now</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
const firebaseConfig = { apiKey:"", authDomain:"", projectId:"" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function togglePass(){
  const p = document.getElementById('pass');
  p.type = p.type==='password' ? 'text' : 'password';
}

function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=> location.href="users.html")
    .catch(e=> alert(e.message));
}
</script>
</body>
</html>

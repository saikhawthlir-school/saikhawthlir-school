<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MizoChat - Login</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; 
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background: #FFFFFF;
    min-height:100vh;
    padding: 40px 20px; /* chung hnuai ah space kan pe hnem */
    display:flex; 
    flex-direction:column;
  }
  
  .container{ 
    width:100%; 
    max-width:300px; /* a zau deuh */
    margin:0 auto; 
    flex:1;
  }
  
  .logo-wrap{ 
    display:flex; 
    align-items:center; 
    gap:14px; 
    margin-bottom:20px; 
  }
  .logo{ 
    width:56px; height:56px; border-radius:16px; /* a lian deuh */
    background: linear-gradient(135deg,#25D366,#128C7E);
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:800; font-size:24px;
  }
  h1{ font-size:32px; margin:0; font-weight:700; } /* a lian deuh */
  .sub{ color:#555; margin:8px 0 32px; font-size:16px; } /* a lian deuh */

  .label{ font-size:14px; font-weight:600; color:#222; margin:18px 4px 8px; display:block; }
  .input{
    width:100%; padding:16px; border:1.5px solid #ddd; border-radius:14px; /* padding kan ti hnem */
    font-size:17px; background:white;
  }
  .input:focus{ outline:none; border-color:#25D366; }

  .pw-wrap{ position:relative; }
  .eye{ 
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:20px; color:#888;
  }

  .forgot{ display:inline-block; margin:12px 4px 0; color:#FF6A00; text-decoration:none; font-weight:600; font-size:15px; }

  .btn{
    width:100%; padding:17px; margin-top:24px; border:none; border-radius:16px; /* a chhah deuh */
    background:#FF6A00; color:white; font-size:18px; font-weight:700; cursor:pointer;
  }
  .btn:active{ transform:scale(0.98); }

  .divider{ text-align:center; margin:28px 0; color:#ccc; font-size:14px; }

  .register{ text-align:center; font-size:15px; color:#333; }
  .register a{ color:#FF6A00; font-weight:700; text-decoration:none; }

  .footer{ 
    display:flex; 
    justify-content:space-between; 
    padding-top:30px; 
    font-size:13px; 
    color:#777; 
  }
  .footer a{ color:#777; text-decoration:none; }
</style>
</head>
<body>

<div class="container">
  <div class="logo-wrap">
    <div class="logo">MC</div>
    <div>
      <h1>Welcome!</h1>
      <div class="sub">Login to your <b>MizoChat</b> Account</div>
    </div>
  </div>

  <label class="label">Login using your Mobile/Email ID and Password</label>
  
  <label class="label">Mobile/Email ID *</label>
  <input id="email" class="input" type="text" placeholder="7005697815 or you@email.com">

  <label class="label">Password *</label>
  <div class="pw-wrap">
    <input id="pass" class="input" type="password" placeholder="Password">
    <span class="eye" onclick="togglePass()">👁️</span>
  </div>

  <a href="#" class="forgot">Forgot Password?</a>

  <button class="btn" onclick="login()">Login</button>

  <div class="divider">────────</div>

  <div class="register">
    Don't have a MizoChat Account? <a href="#" onclick="showReg()">Register Now</a>
  </div>

  <div class="footer">
    <a href="#">License Agreement</a>
    <a href="#">Privacy & Policy</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
const firebaseConfig = { apiKey:"", authDomain:"", projectId:"" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function togglePass(){
  const p = document.getElementById('pass');
  p.type = p.type==='password' ? 'text' : 'password';
}

function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=> location.href="users.html")
    .catch(e=> alert(e.message));
}

function showReg(){
  alert("Register page kan la siam ang boss")
}
</script>
</body>
</html>

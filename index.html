<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MizoChat - Login</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background: #FFFFFF;
    padding: 30px 16px; /* sir ah 16px chiah awm */
  }
  
  .container{ 
    width:100%; /* 100% full */
    max-width:100%; /* max-width kan remove */
  }
  
  .logo-wrap{ 
    display:flex; 
    align-items:center; 
    gap:12px; 
    margin-bottom:20px; 
  }
  .logo{ 
    width:50px; height:50px; border-radius:14px;
    background: linear-gradient(135deg,#25D366,#128C7E);
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:800; font-size:22px;
  }
  h1{ font-size:28px; margin:0; font-weight:700; }
  .sub{ color:#555; margin:6px 0 24px; font-size:15px; }

  .label{ font-size:13px; font-weight:600; color:#222; margin:14px 0 6px; display:block; }
  .input{
    width:100%; padding:14px; border:1.5px solid #e0e0e0; border-radius:12px;
    font-size:16px; background:white;
  }
  .input:focus{ outline:none; border-color:#25D366; }

  .pw-wrap{ position:relative; }
  .eye{ 
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    cursor:pointer; font-size:18px; color:#888;
  }

  .forgot{ display:inline-block; margin:8px 0 0; color:#FF6A00; text-decoration:none; font-weight:600; font-size:14px; }

  .btn{
    width:100%; padding:15px; margin-top:18px; border:none; border-radius:14px;
    background:#FF6A00; color:white; font-size:17px; font-weight:700; cursor:pointer;
  }

  .divider{ text-align:center; margin:20px 0; color:#ccc; font-size:13px; }

  .register{ text-align:center; font-size:14px; color:#333; }
  .register a{ color:#FF6A00; font-weight:700; text-decoration:none; }

</style>
</head>
<body>

<div class="container">
  <div class="logo-wrap">
    <div class="logo">MC</div>
    <div>
      <h1>Welcome!</h1>
      <div class="sub">Login to your <b>MizoChat</b> Account</div>
    </div>
  </div>

  <label class="label">Login using your Mobile/Email ID and Password</label>
  
  <label class="label">Mobile/Email ID *</label>
  <input id="email" class="input" type="text" placeholder="7005697815 or you@email.com">

  <label class="label">Password *</label>
  <div class="pw-wrap">
    <input id="pass" class="input" type="password" placeholder="Password">
    <span class="eye" onclick="togglePass()">👁️</span>
  </div>

  <a href="#" class="forgot">Forgot Password?</a>

  <button class="btn" onclick="login()">Login</button>

  <div class="divider">────────</div>

  <div class="register">
    Don't have a MizoChat Account? <a href="#" onclick="showReg()">Register Now</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
const firebaseConfig = { apiKey:"", authDomain:"", projectId:"" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function togglePass(){
  const p = document.getElementById('pass');
  p.type = p.type==='password' ? 'text' : 'password';
}

function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=> location.href="users.html")
    .catch(e=> alert(e.message));
}

function showReg(){
  alert("Register page kan la siam ang boss")
}
</script>
</body>
</html>

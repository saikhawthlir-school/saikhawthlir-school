<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b141a;color:#e9edef;font-family:'Segoe UI', Arial;font-size:45px;}
.header{background:#202c33;padding:28px 24px;display:flex;gap:20px;align-items:center;font-size:46px;font-weight:600;position:sticky;top:0;}
.header button{background:none;border:none;color:white;font-size:50px;cursor:pointer;}
.profile-top{background:#202c33;padding:50px 30px;text-align:center;}
.avatar-big{width:220px;height:220px;border-radius:50%;background:#2a3942;margin:0 auto 30px;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:500;}
.name{font-size:40px;font-weight:600;margin-bottom:10px;}
.section{margin-top:20px;background:#111b21;}
.item{display:flex;align-items:center;padding:30px 25px;border-bottom:1px solid #202c33;cursor:pointer;}
.item:hover{background:#202c33;}
.item-label{color:#8696a0;font-size:32px;margin-bottom:8px;}
.item-value{font-size:38px;}
</style>
</head>
<body>
<div class="header">
  <button onclick="location.href='users.html'">←</button>
  <span>Profile</span>
</div>

<div class="profile-top">
  <div class="avatar-big" id="profileAvatar">P</div>
  <div class="name" id="profileName">Loading...</div>
</div>

<div class="section">
  <div class="item">
    <div>
      <div class="item-label">Hming</div>
      <div class="item-value" id="profileName2">Loading...</div>
    </div>
  </div>
  <div class="item">
    <div>
      <div class="item-label">Email</div>
      <div class="item-value" id="profileEmail">Loading...</div>
    </div>
  </div>
  <div class="item" onclick="editAbout()">
    <div>
      <div class="item-label">About</div>
      <div class="item-value" id="profileAbout">Hey there! I am using MizoChat</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();

auth.onAuthStateChanged(u=>{
  if(!u) location.href="index.html";
  db.collection("users").doc(u.uid).get().then(doc=>{
    let data = doc.data();
    document.getElementById("profileName").innerText = data.name;
    document.getElementById("profileName2").innerText = data.name;
    document.getElementById("profileEmail").innerText = data.email;
    document.getElementById("profileAvatar").innerText = data.name.split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2);
    if(data.about) document.getElementById("profileAbout").innerText = data.about;
  });
});

function editAbout(){
  let newAbout = prompt("I About thlak rawh:", document.getElementById("profileAbout").innerText);
  if(newAbout){
    db.collection("users").doc(auth.currentUser.uid).update({about: newAbout});
    document.getElementById("profileAbout").innerText = newAbout;
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b141a;color:#e9edef;font-family:'Segoe UI', Arial;font-size:45px;}
.header{background:#202c33;padding:28px 24px;display:flex;gap:20px;align-items:center;font-size:46px;font-weight:600;position:sticky;top:0;}
.header button{background:none;border:none;color:white;font-size:50px;cursor:pointer;}
.section{margin-top:20px;background:#111b21;}
.item{display:flex;flex-direction:column;padding:30px 25px;border-bottom:1px solid #202c33;}
.item-title{font-size:38px;margin-bottom:10px;}
.item-sub{font-size:30px;color:#8696a0;margin-bottom:15px;}
.slider{width:100%;height:10px;background:#2a3942;border-radius:5px;outline:none;-webkit-appearance:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:#00a884;cursor:pointer;}
.slider-value{font-size:34px;color:#00a884;text-align:right;margin-top:10px;}
</style>
</head>
<body>
<div class="header">
  <button onclick="location.href='users.html'">←</button>
  <span>Settings</span>
</div>

<div class="section">
  <div class="item" onclick="location.href='profile.html'">
    <div class="item-title">Profile</div>
    <div class="item-sub">I hming leh info thlakna</div>
  </div>

  <div class="item">
    <div class="item-title">Font Size</div>
    <div class="item-sub">App chhung zawng font lian te ber</div>
    <input type="range" min="30" max="60" value="45" class="slider" id="fontSlider" oninput="changeFont(this.value)">
    <div class="slider-value">Tunah: <span id="fontValue">45</span>px</div>
  </div>

  <div class="item" onclick="alert('Dark Mode ON tawh')">
    <div class="item-title">Dark Mode</div>
    <div class="item-sub">A awm reng</div>
  </div>
  <div class="item" onclick="logout()">
    <div class="item-title" style="color:#ef4444;">Logout</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig); const auth = firebase.auth();

// Page load in font size lo save tawh kha la chhuak
window.onload = function(){
  let savedSize = localStorage.getItem("appFontSize") || 45;
  document.getElementById("fontSlider").value = savedSize;
  document.getElementById("fontValue").innerText = savedSize;
  document.body.style.fontSize = savedSize + "px";
}

function changeFont(size){
  document.getElementById("fontValue").innerText = size;
  localStorage.setItem("appFontSize", size); // Save
  document.body.style.fontSize = size + "px";
  alert("Font size " + size + "px ah dah ani. Page dang ah pawh a inthlak nghal ang");
}

function logout(){ if(confirm("I logout duh takzet maw?")){ auth.signOut(); } }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Group</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b141a;color:white;font-family:'Segoe UI',Arial;height:100vh;display:flex;flex-direction:column;font-size:45px;}
.header{background:#202c33;padding:28px 24px;font-weight:600;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;font-size:46px;z-index:10;}
.header button{background:none;border:none;color:white;font-size:50px;cursor:pointer;}
.menu-btn{background:none;border:none;color:#aebac1;font-size:50px;cursor:pointer;}
.menu{position:absolute;top:115px;right:18px;background:#233138;border-radius:8px;display:none;flex-direction:column;z-index:200;box-shadow:0 6px 15px rgba(0,0,0,0.6);min-width:360px;}
.menu.show{display:flex;} .menu a{padding:28px 34px;color:#d1d7db;text-decoration:none;cursor:pointer;font-size:32px;border-bottom:1px solid #2a3942;} .menu a:hover{background:#182229;}
#chatBox{flex:1;overflow-y:auto;padding:20px;background-image:url('https://user-images.githubusercontent.com/15082520/120515973-9b1ff200-c3b8-11eb-8b1e-5c1c7d5a3b3e.png');background-size:contain;}
.msg{
  background:#202c33;
  padding:24px 28px;
  margin:12px 0;
  border-radius:12px;
  max-width:80%;
  font-size:38px;
  word-wrap:break-word;
  line-height:1.4;
}
.msg.me{background:#005c4b;margin-left:auto;}
.msg b{color:#53bdeb;font-size:32px;display:block;margin-bottom:8px;} /* Group ah hming lian */
.bottom{position:sticky;bottom:0;display:flex;background:#202c33;padding:18px;gap:14px;}
input{flex:1;padding:28px 30px;border:none;border-radius:35px;background:#2a3942;color:white;font-size:36px;}
button.send{padding:28px 30px;background:#00a884;color:#111b21;border:none;border-radius:50%;font-size:40px;cursor:pointer;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:300;}
.modal-content{background:#233138;padding:34px;border-radius:8px;width:90%;max-width:600px;max-height:70vh;overflow-y:auto;font-size:34px;color:#d1d7db;}
</style></head>
<body>
<div class="header">
  <div style="display:flex;gap:20px;align-items:center;">
    <button onclick="location.href='users.html'">←</button>
    <span id="headerName"></span>
  </div>
  <div style="position:relative;">
    <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    <div class="menu" id="menu">
      <a onclick="groupInfo()">Group Info</a>
      <a onclick="addMember()">Member Add</a>
      <a onclick="groupSetting()">Group Hming Thlak</a>
      <a onclick="leaveGroup()">Group Chhuahsan</a>
    </div>
  </div>
</div>

<div id="chatBox"></div>
<div class="bottom"><input id="msgInput" placeholder="Message type rawh..." onkeypress="if(event.key==='Enter') send()"><button class="send" onclick="send()">➤</button></div>

<div class="modal" id="infoModal"><div class="modal-content"><h3 id="groupTitle"></h3><div id="memberList" style="margin-top:10px;"></div><button onclick="closeModal()" style="background:#ef4444;margin-top:15px;padding:20px;width:100%;border:none;border-radius:8px;color:white;font-size:32px;">Close</button></div></div>
<div class="modal" id="memberModal"><div class="modal-content"><h3 id="modalTitle" style="margin-bottom:15px;font-size:36px;">Member thlang rawh</h3><div id="userList"></div><div style="display:flex;gap:10px;margin-top:15px;"><button onclick="closeMemberModal()" style="flex:1;padding:22px;background:#2a3942;border:none;border-radius:8px;color:#d1d7db;font-size:30px;">Cancel</button><button onclick="confirmAdd()" style="flex:1;padding:22px;background:#00a884;border:none;border-radius:8px;color:#111b21;font-weight:bold;font-size:30px;">Add</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
let me=null; let groupId=localStorage.getItem("chatWith"); let groupName=localStorage.getItem("chatName"); let isAdmin=false;
let selectedMembers = []; let modalCallback = null;
document.getElementById("headerName").innerText = groupName;
auth.onAuthStateChanged(u=>{ if(!u) location.href="index.html"; me=u; loadMessages(); checkAdmin(); });

function toggleMenu(){ document.getElementById("menu").classList.toggle("show"); }
function closeModal(){ document.getElementById("infoModal").style.display="none"; }
function checkAdmin(){ db.collection("groups").doc(groupId).get().then(doc=>{ isAdmin = doc.data().admins.includes(me.uid); }); }

function openMemberModal(title, callback, excludeIds=[]){
  selectedMembers = []; modalCallback = callback;
  document.getElementById("modalTitle").innerText = title;
  let html = "";
  db.collection("users").get().then(snap=>{
    snap.forEach(d=>{
      if(d.id != me.uid && !excludeIds.includes(d.id)){
        html += `<label style="display:flex;align-items:center;gap:24px;padding:22px;cursor:pointer;">
          <input type="checkbox" value="${d.id}" style="width:36px;height:36px;" onchange="toggleSelect(this)">
          <div class="avatar" style="width:90px;height:90px;font-size:32px;background:#2a3942;border-radius:50%;display:flex;align-items:center;justify-content:center;">${d.data().name.split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2)}</div>
          <span style="font-size:34px;">${d.data().name}</span>
        </label>`;
      }
    });
    document.getElementById("userList").innerHTML = html || "Member tur an awm lo";
    document.getElementById("memberModal").style.display = "flex";
  });
}
function toggleSelect(cb){ if(cb.checked) selectedMembers.push(cb.value); else selectedMembers = selectedMembers.filter(id => id != cb.value); }
function closeMemberModal(){ document.getElementById("memberModal").style.display = "none"; }
function confirmAdd(){ if(selectedMembers.length == 0) return alert("Tu mah i thlang lo"); modalCallback(selectedMembers); closeMemberModal(); }

function groupInfo(){
  db.collection("groups").doc(groupId).get().then(doc=>{
    let data = doc.data(); document.getElementById("groupTitle").innerText = data.name + " - Members: " + data.members.length;
    let html=""; data.members.forEach(uid=>{ db.collection("users").doc(uid).get().then(u=>{ html += `<div style="padding:16px 0;display:flex;gap:16px;align-items:center;"><div style="width:90px;height:90px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:32px;">${u.data().name[0]}</div>${u.data().name} ${data.admins.includes(uid)?'👑 Admin':''}</div>`; document.getElementById("memberList").innerHTML = html; }); });
  }); document.getElementById("infoModal").style.display="flex"; toggleMenu();
}

function addMember(){
  if(!isAdmin) return alert("Admin chiah in member a add thei");
  db.collection("groups").doc(groupId).get().then(doc=>{
    let currentMembers = doc.data().members;
    openMemberModal("Member thar add", (chosen)=>{
      db.collection("groups").doc(groupId).update({members: firebase.firestore.FieldValue.arrayUnion(...chosen)}).then(()=>alert("Member add zawh"));
    }, currentMembers);
  }); toggleMenu();
}

function groupSetting(){ if(!isAdmin) return alert("Admin chiah in a thlak thei"); let newName = prompt("Group hming thar:", groupName); if(newName){ db.collection("groups").doc(groupId).update({name:newName}); document.getElementById("headerName").innerText = newName; localStorage.setItem("chatName", newName); } toggleMenu(); }
function leaveGroup(){ if(confirm("I chhuah duh takzet maw?")){ db.collection("groups").doc(groupId).update({members: firebase.firestore.FieldValue.arrayRemove(me.uid)}).then(()=>location.href="users.html"); } toggleMenu(); }
function loadMessages(){ db.collection("groupChats").doc(groupId).collection("messages").orderBy("time").onSnapshot(snap=>{ let html=""; snap.forEach(d=>{ let data=d.data(); let cls = data.uid==me.uid ? "msg me" : "msg"; html+=`<div class="${cls}">${data.uid!=me.uid?`<b>${data.name}</b>`:''}${data.text}</div>`; }); document.getElementById("chatBox").innerHTML = html; document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight; }); }
function send(){ let txt=document.getElementById("msgInput").value.trim(); if(!txt) return; db.collection("users").doc(me.uid).get().then(doc=>{ db.collection("groupChats").doc(groupId).collection("messages").add({text:txt,uid:me.uid,name:doc.data().name,time:Date.now()}); document.getElementById("msgInput").value=""; }); }
document.addEventListener('click', function(e){ if(!e.target.closest('.header')) document.getElementById("menu").classList.remove("show"); });
</script></body></html>

<script>
// Page load apiang in font size saved kha a apply nghal
window.onload = function(){
  let savedSize = localStorage.getItem("appFontSize") || 45;
  document.body.style.fontSize = savedSize + "px";
}
</script>

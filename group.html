<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group</title>
<style>
:root{--bg:#0b141a;--bg2:#202c33;--msg:#202c33;--msgme:#005c4b;--text:#e9edef;--sub:#aebac1;--green:#00a884;}
body.light{--bg:#e5ddd5;--bg2:#ffffff;--msg:#ffffff;--msgme:#d9fdd3;--text:#111b21;--sub:#667781;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial;height:100vh;display:flex;flex-direction:column;}
.header{background:var(--bg2);padding:28px 24px;font-weight:600;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.header button{background:none;border:none;color:var(--text);font-size:50px;cursor:pointer;}
.menu-btn{background:none;border:none;color:var(--sub);font-size:50px;cursor:pointer;}
.menu{position:absolute;top:115px;right:18px;background:var(--bg2);border-radius:8px;display:none;flex-direction:column;z-index:200;box-shadow:0 6px 15px rgba(0,0,0,0.6);min-width:360px;}
.menu.show{display:flex;}.menu a{padding:28px 34px;color:var(--text);text-decoration:none;cursor:pointer;border-bottom:1px solid #2a3942;}.menu a:hover{background:#182229;}
#chatBox{flex:1;overflow-y:auto;padding:20px;background-image:url('https://user-images.githubusercontent.com/15082520/120515973-9b1ff200-c3b8-11eb-8b1e-5c1c7d5a3b3e.png');background-size:contain;}
.msg{background:var(--msg);padding:24px 28px;margin:12px 0;border-radius:12px;max-width:80%;word-wrap:break-word;line-height:1.4;}
.msg.me{background:var(--msgme);margin-left:auto;}
.msg b{color:#53bdeb;display:block;margin-bottom:8px;}
.bottom{position:sticky;bottom:0;display:flex;background:var(--bg2);padding:18px;gap:14px;}
input{flex:1;padding:28px 30px;border:none;border-radius:35px;background:#2a3942;color:var(--text);}
button.send{padding:28px 30px;background:var(--green);color:var(--bg);border:none;border-radius:50%;font-size:40px;cursor:pointer;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:300;}
.modal-content{background:var(--bg2);padding:34px;border-radius:8px;width:90%;max-width:600px;max-height:70vh;overflow-y:auto;}
</style>
<script>
window.onload = function(){
  let savedSize = localStorage.getItem("appFontSize") || "medium";
  let px = savedSize == "small"? 34 : savedSize == "medium"? 45 : 55;
  document.body.style.fontSize = px + "px";
  let dark = localStorage.getItem("darkMode") || "on";
  if(dark == "off"){ document.body.classList.add("light"); }
}
</script>
</head>
<body>
<div class="header">
  <div style="display:flex;gap:20px;align-items:center;">
    <button onclick="location.href='users.html'">←</button>
    <span id="headerName"></span>
  </div>
  <div style="position:relative;">
    <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    <div class="menu" id="menu">
      <a onclick="groupInfo()">Group Info</a>
      <a onclick="addMember()">Member Add</a>
      <a onclick="groupSetting()">Group Hming Thlak</a>
      <a onclick="leaveGroup()">Group Chhuahsan</a>
    </div>
  </div>
</div>

<div id="chatBox"></div>
<div class="bottom"><input id="msgInput" placeholder="Message type rawh..." onkeypress="if(event.key==='Enter') send()"><button class="send" onclick="send()">➤</button></div>

<div class="modal" id="infoModal"><div class="modal-content"><h3 id="groupTitle"></h3><div id="memberList" style="margin-top:10px;"></div><button onclick="closeModal()" style="background:#ef4444;margin-top:15px;padding:20px;width:100%;border:none;border-radius:8px;color:white;">Close</button></div></div>
<div class="modal" id="memberModal"><div class="modal-content"><h3 id="modalTitle" style="margin-bottom:15px;">Member thlang rawh</h3><div id="userList"></div><div style="display:flex;gap:10px;margin-top:15px;"><button onclick="closeMemberModal()" style="flex:1;padding:22px;background:#2a3942;border:none;border-radius:8px;color:var(--text);">Cancel</button><button onclick="confirmAdd()" style="flex:1;padding:22px;background:var(--green);border:none;border-radius:8px;color:var(--bg);font-weight:bold;">Add</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
let me=null; let groupId=localStorage.getItem("chatWith"); let groupName=localStorage.getItem("chatName"); let isAdmin=false;
let selectedMembers = []; let modalCallback = null;
document.getElementById("headerName").innerText = groupName;
auth.onAuthStateChanged(u=>{ if(!u) location.href="index.html"; me=u; loadMessages(); checkAdmin(); });

function toggleMenu(){ document.getElementById("menu").classList.toggle("show"); }
function closeModal(){ document.getElementById("infoModal").style.display="none"; }
function checkAdmin(){ db.collection("groups").doc(groupId).get().then(doc=>{ isAdmin = doc.data().admins.includes(me.uid); }); }

function openMemberModal(title, callback, excludeIds=[]){
  selectedMembers = []; modalCallback = callback; document.getElementById("modalTitle").innerText = title; let html = "";
  db.collection("users").get().then(snap=>{ snap.forEach(d=>{ if(d.id!= me.uid &&!excludeIds.includes(d.id)){
    html += `<label style="display:flex;align-items:center;gap:24px;padding:22px;cursor:pointer;"><input type="checkbox" value="${d.id}" style="width:36px;height:36px;" onchange="toggleSelect(this)"><div style="width:90px;height:90px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;">${d.data().name[0]}</div><span>${d.data().name}</span></label>`;
  }}); document.getElementById("userList").innerHTML = html || "Member tur an awm lo"; document.getElementById("memberModal").style.display = "flex"; });
}
function toggleSelect(cb){ if(cb.checked) selectedMembers.push(cb.value); else selectedMembers = selectedMembers.filter(id => id!= cb.value); }
function closeMemberModal(){ document.getElementById("memberModal").style.display = "none"; }
function confirmAdd(){ if(selectedMembers.length == 0) return; modalCallback(selectedMembers); closeMemberModal(); }

function groupInfo(){
  db.collection("groups").doc(groupId).get().then(doc=>{
    let data = doc.data(); document.getElementById("groupTitle").innerText = data.name + " - Members: " + data.members.length;
    let html=""; data.members.forEach(uid=>{ db.collection("users").doc(uid).get().then(u=>{ html += `<div style="padding:16px 0;display:flex;gap:16px;align-items:center;"><div style="width:90px;height:90px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;">${u.data().name[0]}</div>${u.data().name} ${data.admins.includes(uid)?'👑 Admin':''}</div>`; document.getElementById("memberList").innerHTML = html; }); });
  }); document.getElementById("infoModal").style.display="flex"; toggleMenu();
}

function addMember(){ if(!isAdmin) return; db.collection("groups").doc(groupId).get().then(doc=>{ let currentMembers = doc.data().members; openMemberModal("Member thar add", (chosen)=>{ db.collection("groups").doc(groupId).update({members: firebase.firestore.FieldValue.arrayUnion(...chosen)}); }, currentMembers); }); toggleMenu(); }

function groupSetting(){ if(!isAdmin) return; let newName = prompt("Group hming thar:", groupName); if(newName){ db.collection("groups").doc(groupId).update({name:newName}); document.getElementById("headerName").innerText = newName; localStorage.setItem("chatName", newName); } toggleMenu(); }
function leaveGroup(){ if(confirm("I chhuah duh takzet maw?")){ db.collection("groups").doc(groupId).update({members: firebase.firestore.FieldValue.arrayRemove(me.uid)}).then(()=>location.href="users.html"); } toggleMenu(); }
function loadMessages(){ db.collection("groupChats").doc(groupId).collection("messages").orderBy("time").onSnapshot(snap=>{ let html=""; snap.forEach(d=>{ let data=d.data(); let cls = data.uid==me.uid? "msg me" : "msg"; html+=`<div class="${cls}">${data.uid!=me.uid?`<b>${data.name}</b>`:''}${data.text}</div>`; }); document.getElementById("chatBox").innerHTML = html; document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight; }); }
function send(){ let txt=document.getElementById("msgInput").value.trim(); if(!txt) return; db.collection("users").doc(me.uid).get().then(doc=>{ db.collection("groupChats").doc(groupId).collection("messages").add({text:txt,uid:me.uid,name:doc.data().name,time:Date.now()}); document.getElementById("msgInput").value=""; }); }
document.addEventListener('click', function(e){ if(!e.target.closest('.header')) document.getElementById("menu").classList.remove("show"); });
</script>
</body>
</html>

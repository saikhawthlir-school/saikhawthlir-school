<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "school-project-dab29.firebaseapp.com",
      projectId: "school-project-dab29",
      storageBucket: "school-project-dab29.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("resetForm");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        msg.style.color = "#059669";
        msg.innerText = "Thawn mek...";

        try {
          await sendPasswordResetEmail(auth, email);
          msg.style.color = "green";
          msg.innerText = "Reset link i email ah kan thawn tawh. Spam pawh check rawh.";
          document.getElementById("email").value = "";
        } catch (error) {
          msg.style.color = "red";
          if(error.code === 'auth/user-not-found'){
            msg.innerText = "He email hmang hian account a awm lo";
          } else if(error.code === 'auth/invalid-email'){
            msg.innerText = "Email format a dik lo";
          } else {
            msg.innerText = "Error: " + error.message;
          }
        }
      });
    });
  </script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { background: white; padding: 30px 25px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    .logo { width: 60px; height: 60px; background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; margin: 0 auto 15px auto; }
    h1 { font-size: 24px; margin: 0 0 5px 0; font-weight: 700; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
    label { font-size: 14px; font-weight: 600; display: block; margin-top: 18px; margin-bottom: 6px; color: #111; text-align: left; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 15px; outline: none; text-align: left; }
    input:focus { border-color: #10b981; }
    button { width: 100%; padding: 14px; margin-top: 22px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { opacity: 0.95; }
    .footer { text-align: center; margin-top: 22px; font-size: 14px; color: #374151; }
    .footer a { color: #059669; text-decoration: none; font-weight: 700; }
    #msg { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">MC</div>
    <h1>Forgot Password</h1>
    <div class="subtitle">Reset link kan lo thawn ang</div>

    <form id="resetForm">
      <label>Fill in your email to Reset</label>
      <input type="email" id="email" placeholder="Email ID *" required>
      
      <button type="submit">Send Reset Link</button>
    </form>

    <p id="msg"></p>

    <div class="footer">
      Remember your password? <a href="login.html">Login Now</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // I Firebase config dah rawh
    const firebaseConfig = {
      apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
      authDomain: "school-project-dab29.firebaseapp.com",
      projectId: "school-project-dab29",
      storageBucket: "school-project-dab29.appspot.com",
      messagingSenderId: "214125475324",
      appId: "1:214125475324:web:83f908e4476ef8be3c2e79"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("resetForm");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        msg.innerText = "Thawn mek...";

        try {
          await sendPasswordResetEmail(auth, email);
          msg.style.color = "green";
          msg.innerText = "Password reset link i email ah kan thawn tawh. Inbox/Spam check rawh.";
          document.getElementById("email").value = "";
        } catch (error) {
          msg.style.color = "red";
          if(error.code === 'auth/user-not-found'){
            msg.innerText = "He email hmang hian account a awm lo";
          } else if(error.code === 'auth/invalid-email'){
            msg.innerText = "Email format a dik lo";
          } else {
            msg.innerText = "Error: " + error.message;
          }
        }
      });
    });
  </script>
  <style>
    body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f5f5f5; }
    .box { background:white; padding:25px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:320px; }
    input, button { width:100%; padding:10px; margin:8px 0; border-radius:5px; border:1px solid #ccc; }
    button { background:#2563eb; color:white; border:none; cursor:pointer; }
    button:hover { background:#1e40af; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Password Theihnghilh</h2>
    <p>I email dah la reset link kan lo thawn ang</p>
    <form id="resetForm">
      <input type="email" id="email" placeholder="email@example.com" required>
      <button type="submit">Reset Link Thawn</button>
    </form>
    <p id="msg"></p>
    <a href="login.html">← Login ah kir leh</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
      authDomain: "school-project-dab29.firebaseapp.com",
      projectId: "school-project-dab29",
      storageBucket: "school-project-dab29.appspot.com",
      messagingSenderId: "214125475324",
      appId: "1:214125475324:web:83f908e4476ef8be3c2e79"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("resetForm");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        
        msg.innerText = ""; // A tir ah clear phawt

        try {
          await sendPasswordResetEmail(auth, email);
          msg.style.color = "green";
          msg.innerText = "Reset link i email ah kan thawn tawh. Spam pawh check rawh.";
          document.getElementById("email").value = "";
        } catch (error) {
          msg.style.color = "red";
          if(error.code === 'auth/user-not-found'){
            msg.innerText = "He email hmang hian account a awm lo";
          } else if(error.code === 'auth/invalid-email'){
            msg.innerText = "Email format a dik lo. example@gmail.com ti ang in ziak rawh";
          } else if(error.code === 'auth/too-many-requests'){
            msg.innerText = "I hmet tam lutuk. 1min hnu ah han ti nawn leh rawh";
          } else {
            msg.innerText = "Error: " + error.message;
          }
        }
      });
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #fff; display: flex; justify-content: flex-start; align-items: flex-start; min-height: 100vh; padding: 15px 20px 20px 20px; }
    
    .wrapper { width: 100%; max-width: 420px; margin: 0 auto; }
    
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .logo { 
      width: 56px; 
      height: 56px; 
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #fff; 
      font-weight: 800; 
      font-size: 24px; 
      box-shadow: 0 4px 12px rgba(16,185,129,0.25);
      flex-shrink: 0;
    }
    .header-text h1 { font-size: 26px; font-weight: 700; color: #111; line-height: 1.2; }
    .header-text p { font-size: 15px; color: #6b7280; margin-top: 2px; }
    .header-text p b { color: #111; font-weight: 600; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; color: #111; margin-bottom: 6px; }
    .form-group input { 
      width: 100%; 
      padding: 13px 14px; 
      border: 1.5px solid #e5e7eb; 
      border-radius: 10px; 
      font-size: 15px; 
      outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus { border-color: #10b981; }

    .btn { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    .footer-text { text-align: center; margin-top: 22px; font-size: 14px; color: #4b5563; }
    .footer-text a { color: #059669; font-weight: 700; text-decoration: none; }

    #msg { margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="logo">MC</div>
      <div class="header-text">
        <h1>Forgot Password</h1>
        <p>Reset link <b>MizoChat</b> ah kan lo thawn ang</p>
      </div>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label>Fill in your email to Reset</label>
        <input type="email" id="email" placeholder="Email ID *" required>
      </div>

      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <p id="msg"></p>

    <div class="footer-text">
      Remember your password? <a href="login.html">Login Now</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizoChat</title>
<style>
body{background:#111b21;color:white;font-family:Arial;margin:0;padding-bottom:70px;}
.header{background:#202c33;padding:12px;display:flex;justify-content:space-between;font-weight:bold;position:sticky;top:0;}
.item{display:flex;gap:10px;align-items:center;background:#202c33;padding:12px;margin:2px 0;cursor:pointer;}
.item:hover{background:#2a3942;}
.item img{width:50px;height:50px;border-radius:50%;background:#2a3942;}
.bottom-btn{position:fixed;bottom:20px;right:20px;width:55px;height:55px;border-radius:50%;background:#00a884;color:white;border:none;font-size:30px;cursor:pointer;}
.menu{position:absolute;top:50px;right:10px;background:#202c33;border-radius:8px;display:none;flex-direction:column;z-index:20;}
.menu.show{display:flex;} .menu a{padding:12px 20px;color:white;text-decoration:none;} .menu a:hover{background:#2a3942;}
</style>
</head>
<body>
<div class="header">
  <span>MizoChat</span>
  <div style="position:relative;">
    <button onclick="toggleMenu()" style="background:none;border:none;color:white;font-size:22px;">⋮</button>
    <div class="menu" id="menu">
      <a onclick="newGroup()">Group thar siam</a>
      <a onclick="logout()">Logout</a>
    </div>
  </div>
</div>

<div id="chatList">Loading...</div>
<button class="bottom-btn" onclick="newGroup()">+</button>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.firestore();
let me=null;

auth.onAuthStateChanged(u=>{ if(!u) location.href="index.html"; me=u; loadChats(); });

function toggleMenu(){ document.getElementById("menu").classList.toggle("show"); }
function logout(){ auth.signOut(); }

function newGroup(){
  let name = prompt("Group hming dah rawh:");
  if(!name) return;
  db.collection("groups").add({name:name, members:[me.uid], createdBy:me.uid, time:Date.now()});
}

function loadChats(){
  let html="";
  // Private chats
  db.collection("users").onSnapshot(snap=>{
    snap.forEach(d=>{
      if(d.id != me.uid){
        html+=`<div class="item" onclick="openPrivate('${d.id}','${d.data().name}')">
          <img src="https://ui-avatars.com/api/?name=${d.data().name}">
          <div><b>${d.data().name}</b></div>
        </div>`;
      }
    });
    // Group chats
    db.collection("groups").where("members","array-contains",me.uid).onSnapshot(gsnap=>{
      gsnap.forEach(g=>{
        html+=`<div class="item" onclick="openGroup('${g.id}','${g.data().name}')">
          <img src="https://ui-avatars.com/api/?name=${g.data().name}&background=00a884">
          <div><b>${g.data().name}</b><br><small>Group</small></div>
        </div>`;
      });
      document.getElementById("chatList").innerHTML = html || "Chat i la nei lo";
    });
  });
}

function openPrivate(uid,name){
  localStorage.setItem("chatType","private");
  localStorage.setItem("chatWith",uid);
  localStorage.setItem("chatName",name);
  location.href="chat.html";
}
function openGroup(gid,name){
  localStorage.setItem("chatType","group");
  localStorage.setItem("chatWith",gid);
  localStorage.setItem("chatName",name);
  location.href="group.html";
}
</script>
</body>
</html>

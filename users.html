<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizoChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b141a;color:#e9edef;font-family:'Segoe UI', Arial;padding-bottom:130px;font-size:32px;} /* 32px */
.header{background:#202c33;padding:25px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:600;position:sticky;top:0;z-index:10;font-size:34px;}
.tabs{display:flex;background:#202c33;position:sticky;top:84px;z-index:10;}
.tab{flex:1;text-align:center;padding:24px;cursor:pointer;font-weight:600;font-size:24px;color:#8696a0;letter-spacing:1px;}
.tab.active{color:#00a884;border-bottom:4px solid #00a884;}
.page{display:none;}
.page.active{display:block;}
.item{display:flex;gap:24px;align-items:center;background:#111b21;padding:24px 26px;cursor:pointer;border-bottom:1px solid #1f2c33;min-height:120px;} /* sang hle */
.item:active{background:#2a3942;}
.avatar{width:95px;height:95px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:34px;flex-shrink:0;color:#e9edef;} /* 95px */
.avatar.status{border:4px solid #00a884;}
.chat-info{flex:1;overflow:hidden;}
.chat-name{font-size:28px;font-weight:500;margin-bottom:6px;color:#e9edef;}
.last-msg{font-size:22px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bottom-btn{position:fixed;bottom:30px;right:24px;width:85px;height:85px;border-radius:50%;background:#00a884;color:#111b21;border:none;font-size:50px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.4);z-index:10;font-weight:300;}
.bottom-status{display:flex;background:#202c33;padding:16px;gap:14px;position:fixed;bottom:0;left:0;width:100%;}
.bottom-status input{flex:1;padding:22px 24px;border:none;border-radius:30px;background:#2a3942;color:white;font-size:26px;}
.bottom-status button{padding:22px 26px;background:#00a884;color:#111b21;border:none;border-radius:30px;font-weight:600;font-size:24px;}
.menu{position:absolute;top:85px;right:14px;background:#233138;border-radius:5px;display:none;flex-direction:column;z-index:20;box-shadow:0 4px 10px rgba(0,0,0,0.4);min-width:280px;}
.menu.show{display:flex;}
.menu a{padding:22px 28px;color:#d1d7db;text-decoration:none;cursor:pointer;font-size:24px;border-bottom:1px solid #2a3942;}
.menu a:hover{background:#182229;}
.menu a:last-child{border-bottom:none;color:#ef4444;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:40;}
.modal-content{background:#233138;padding:28px;border-radius:5px;width:90%;max-width:500px;max-height:70vh;overflow-y:auto;color:#d1d7db;font-size:26px;}
</style>
</head>
<body>
<div class="header">
  <span>MizoChat</span>
  <div style="position:relative;">
    <button onclick="toggleMenu()" style="background:none;border:none;color:#aebac1;font-size:36px;">⋮</button>
    <div class="menu" id="menu">
      <a onclick="openProfile()">Profile</a>
      <a onclick="newGroup()">Create Group</a>
      <a onclick="openSetting()">Setting</a>
      <a onclick="logout()">Logout</a>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('chats',this)">CHATS</div>
  <div class="tab" onclick="showTab('status',this)">STATUS</div>
</div>

<div id="chats" class="page active">
  <div id="chatList">Loading...</div>
  <button class="bottom-btn" onclick="newGroup()">+</button>
</div>

<div id="status" class="page">
  <div id="statusList">Loading...</div>
  <div class="bottom-status">
    <input id="statusInput" placeholder="Type a status">
    <button onclick="postStatus()">Post</button>
  </div>
</div>

<div class="modal" id="memberModal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-bottom:15px;font-size:28px;">Select contacts</h3>
    <div id="userList"></div>
    <div style="display:flex;gap:10px;margin-top:15px;">
      <button onclick="closeMemberModal()" style="flex:1;padding:18px;background:#2a3942;border:none;border-radius:5px;color:#d1d7db;font-size:22px;">Cancel</button>
      <button onclick="confirmAdd()" style="flex:1;padding:18px;background:#00a884;border:none;border-radius:5px;color:#111b21;font-weight:bold;font-size:22px;">OK</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.firestore(); let me=null;
let selectedMembers = []; let modalCallback = null;

auth.onAuthStateChanged(u=>{ if(!u) location.href="index.html"; me=u; loadChats(); loadStatus(); });
function toggleMenu(){ document.getElementById("menu").classList.toggle("show"); }
function showTab(id,el){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("active")); document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); document.getElementById(id).classList.add("active"); el.classList.add("active"); }

function openProfile(){
  db.collection("users").doc(me.uid).get().then(doc=>{
    let data = doc.data();
    alert("PROFILE\n\nHming: " + data.name + "\nEmail: " + data.email);
  });
  toggleMenu();
}
function openSetting(){
  alert("SETTING\n\n1. Dark Mode: ON\n2. Notification: ON\n[La siam belh zel tur]");
  toggleMenu();
}
function logout(){
  if(confirm("I logout duh takzet maw?")){
    auth.signOut();
  }
  toggleMenu();
}

function openMemberModal(title, callback, excludeIds=[]){
  selectedMembers = []; modalCallback = callback;
  document.getElementById("modalTitle").innerText = title;
  let html = "";
  db.collection("users").get().then(snap=>{
    snap.forEach(d=>{
      if(d.id != me.uid && !excludeIds.includes(d.id)){
        html += `<label style="display:flex;align-items:center;gap:20px;padding:18px;cursor:pointer;">
          <input type="checkbox" value="${d.id}" style="width:28px;height:28px;" onchange="toggleSelect(this)">
          <div class="avatar" style="width:70px;height:70px;font-size:24px;">${getInitials(d.data().name)}</div>
          <span style="font-size:26px;">${d.data().name}</span>
        </label>`;
      }
    });
    document.getElementById("userList").innerHTML = html || "No contacts";
    document.getElementById("memberModal").style.display = "flex";
  });
}
function toggleSelect(cb){ if(cb.checked) selectedMembers.push(cb.value); else selectedMembers = selectedMembers.filter(id => id != cb.value); }
function closeMemberModal(){ document.getElementById("memberModal").style.display = "none"; }
function confirmAdd(){ if(selectedMembers.length == 0) return alert("Select at least 1 contact"); modalCallback(selectedMembers); closeMemberModal(); }

function newGroup(){
  let name = prompt("Enter group subject");
  if(!name) return;
  openMemberModal("Add participants", (chosen)=>{
    let members = [me.uid, ...chosen];
    db.collection("groups").add({name:name,members:members,admins:[me.uid],createdBy:me.uid,time:Date.now()}).then(()=>alert("Group created"));
  });
  toggleMenu();
}

function getInitials(name){ return name.split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2); }

function loadChats(){
  db.collection("users").onSnapshot(snap=>{
    snap.forEach(d=>{
      if(d.id!= me.uid){
        let chatId = [me.uid,d.id].sort().join("_");
        db.collection("privateChats").doc(chatId).collection("messages").orderBy("time","desc").limit(1).onSnapshot(msnap=>{
          let lastText = "Tap to chat"; if(!msnap.empty) lastText = msnap.docs[0].data().text;
          let div = document.getElementById("p-"+d.id); if(!div){ div = document.createElement("div"); div.id = "p-"+d.id; div.className = "item"; div.onclick = ()=>openPrivate(d.id,d.data().name); document.getElementById("chatList").prepend(div); }
          div.innerHTML = `<div class="avatar">${getInitials(d.data().name)}</div><div class="chat-info"><div class="chat-name">${d.data().name}</div><div class="last-msg">${lastText}</div></div>`;
        });
      }
    });
  });
  db.collection("groups").where("members","array-contains",me.uid).onSnapshot(gsnap=>{
    gsnap.forEach(g=>{
      let data = g.data(); let div = document.getElementById("g-"+g.id); if(!div){ div = document.createElement("div"); div.id = "g-"+g.id; div.className = "item"; div.onclick = ()=>openGroup(g.id,data.name); document.getElementById("chatList").prepend(div); }
      div.innerHTML = `<div class="avatar" style="background:#008069">${getInitials(data.name)}</div><div class="chat-info"><div class="chat-name">${data.name}</div><div class="last-msg">👥 Group</div></div>`;
    });
  });
}

function loadStatus(){ db.collection("status").orderBy("time","desc").onSnapshot(snap=>{ let html=""; snap.forEach(d=>{ let data = d.data(); html+=`<div class="item"><div class="avatar status">${getInitials(data.name)}</div><div class="chat-info" style="border:none;"><div class="chat-name">${data.name}</div><div class="last-msg">${data.text}</div></div></div>`; }); document.getElementById("statusList").innerHTML = html || '<div style="padding:30px;text-align:center;color:#8696a0;font-size:24px">No recent updates</div>'; }); }
function postStatus(){ let txt=document.getElementById("statusInput").value.trim(); if(!txt) return; db.collection("users").doc(me.uid).get().then(doc=>{ db.collection("status").add({text:txt,name:doc.data().name,time:Date.now()}); document.getElementById("statusInput").value=""; }); }
function openPrivate(uid,name){ localStorage.setItem("chatWith",uid); localStorage.setItem("chatName",name); location.href="chat.html"; }
function openGroup(gid,name){ localStorage.setItem("chatWith",gid); localStorage.setItem("chatName",name); location.href="group.html"; }
document.addEventListener('click', function(e){ if(!e.target.closest('.header')) document.getElementById("menu").classList.remove("show"); });
</script>
</body>
</html>

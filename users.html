<!DOCTYPE html>
<html>
<head>
  <title>Find Friends - SKT School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --bg: #f0f2f5; --card: white; --text: #050505; --sub: #65676b; }
    body.dark { --bg: #18191a; --card: #242526; --text: #e4e6eb; --sub: #b0b3b8; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial; }
    body { background: var(--bg); color: var(--text) }
 .header { background: var(--card); padding: 10px 20px; display:flex; justify-content:space-between; align-items:center }
 .header h2 { color:#1877f2 }
 .container { max-width: 600px; margin: 20px auto; padding: 0 10px; }
 .user-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center }
 .user-info { display:flex; align-items:center; gap:10px }
 .avatar { width:40px; height:40px; border-radius:50%; background: linear-gradient(45deg, #1877f2, #42a5f5); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold }
 .user-card button { padding:8px 16px; border-radius:8px; border:none; background:#1877f2; color:white; font-weight:bold; cursor:pointer }
 .user-card button:disabled { background:var(--sub); cursor:default }
  </style>
</head>
<body>
  <div class="header">
    <h2>Find Friends</h2>
    <button onclick="window.location='feed.html'">Home</button>
  </div>
  <div class="container" id="userList">Loading...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk", authDomain: "school-project-dab29.firebaseapp.com", projectId: "school-project-dab29" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  if(localStorage.getItem('dark') === 'true') document.body.classList.add('dark');

  onAuthStateChanged(auth, async (user) => {
    if (!user) window.location.href = "login.html";
    else { 
      currentUser = user;
      if(!user.friends) await updateDoc(doc(db, "users", user.uid), {friends: [], requests: []});
      loadUsers();
    }
  });

  window.addFriend = async (targetUid) => {
    await updateDoc(doc(db, "users", targetUid), {
      requests: arrayUnion(currentUser.uid)
    });
    alert("Friend request i thawn e");
    loadUsers();
  }

  async function loadUsers() {
    const snap = await getDocs(collection(db, "users"));
    let html = "";
    snap.forEach(docSnap => {
      if(docSnap.id === currentUser.uid) return;
      const data = docSnap.data();
      const sent = data.requests?.includes(currentUser.uid);
      html += `
        <div class="user-card">
          <div class="user-info">
            <div class="avatar">${data.name?.charAt(0) || "?"}</div>
            <div><b>${data.name || "User"}</b></div>
          </div>
          <button onclick="addFriend('${docSnap.id}')" ${sent? 'disabled' : ''}>${sent? 'Sent' : 'Add Friend'}</button>
        </div>`;
    });
    document.getElementById('userList').innerHTML = html || "User dang an awm lo";
  }
</script>
</body>
</html>

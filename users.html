<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MizoChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111b21;color:white;font-family:'Segoe UI', Arial;padding-bottom:90px;font-size:18px;}
.header{background:#202c33;padding:18px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;position:sticky;top:0;z-index:10;font-size:22px;}
.tabs{display:flex;background:#202c33;position:sticky;top:60px;z-index:10;}
.tab{flex:1;text-align:center;padding:16px;cursor:pointer;font-weight:600;font-size:17px;color:#8696a0;}
.tab.active{color:#00a884;border-bottom:3px solid #00a884;}
.page{display:none;}
.page.active{display:block;}
.item{display:flex;gap:14px;align-items:center;background:#111b21;padding:16px 18px;cursor:pointer;border-bottom:1px solid #202c33;}
.item:hover{background:#202c33;}
.avatar{width:65px;height:65px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px;flex-shrink:0;}
.avatar.status{border:4px solid #00a884;}
.chat-info{flex:1;overflow:hidden;}
.chat-name{font-size:18px;font-weight:600;margin-bottom:4px;}
.last-msg{font-size:15px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bottom-btn{position:fixed;bottom:25px;right:25px;width:65px;height:65px;border-radius:50%;background:#00a884;color:white;border:none;font-size:35px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.4);z-index:10;}
.bottom-status{display:flex;background:#202c33;padding:12px;gap:10px;position:fixed;bottom:0;left:0;width:100%;}
.bottom-status input{flex:1;padding:16px;border:none;border-radius:10px;background:#2a3942;color:white;font-size:18px;}
.bottom-status button{padding:16px 18px;background:#00a884;color:white;border:none;border-radius:10px;font-weight:bold;font-size:18px;}
.menu{position:absolute;top:60px;right:10px;background:#202c33;border-radius:10px;display:none;flex-direction:column;z-index:20;box-shadow:0 4px 10px black;min-width:180px;}
.menu.show{display:flex;}
.menu a{padding:16px 22px;color:white;text-decoration:none;cursor:pointer;font-size:17px;}
.menu a:hover{background:#2a3942;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:40;}
.modal-content{background:#202c33;padding:20px;border-radius:10px;width:90%;max-width:400px;max-height:70vh;overflow-y:auto;}
</style>
</head>
<body>
<div class="header">
  <span>MizoChat</span>
  <div style="position:relative;">
    <button onclick="toggleMenu()" style="background:none;border:none;color:white;font-size:28px;">⋮</button>
    <div class="menu" id="menu">
      <a onclick="newGroup()">Group thar siam</a>
      <a onclick="logout()">Logout</a>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('chats',this)">CHATS</div>
  <div class="tab" onclick="showTab('status',this)">STATUS</div>
</div>

<div id="chats" class="page active">
  <div id="chatList">Loading...</div>
  <button class="bottom-btn" onclick="newGroup()">+</button>
</div>

<div id="status" class="page">
  <div id="statusList">Loading...</div>
  <div class="bottom-status">
    <input id="statusInput" placeholder="I status update rawh...">
    <button onclick="postStatus()">Post</button>
  </div>
</div>

<!-- MEMBER SELECT MODAL -->
<div class="modal" id="memberModal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-bottom:15px;">Member thlang rawh</h3>
    <div id="userList"></div>
    <div style="display:flex;gap:10px;margin-top:15px;">
      <button onclick="closeMemberModal()" style="flex:1;padding:12px;background:#555;border:none;border-radius:8px;color:white;font-size:16px;">Cancel</button>
      <button onclick="confirmAdd()" style="flex:1;padding:12px;background:#00a884;border:none;border-radius:8px;color:white;font-weight:bold;font-size:16px;">Add</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.firestore(); let me=null;
let selectedMembers = []; let modalCallback = null;

auth.onAuthStateChanged(u=>{ if(!u) location.href="index.html"; me=u; loadChats(); loadStatus(); });
function toggleMenu(){ document.getElementById("menu").classList.toggle("show"); }
function logout(){ auth.signOut(); }
function showTab(id,el){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("active")); document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); document.getElementById(id).classList.add("active"); el.classList.add("active"); }

function openMemberModal(title, callback, excludeIds=[]){
  selectedMembers = []; modalCallback = callback;
  document.getElementById("modalTitle").innerText = title;
  let html = "";
  db.collection("users").get().then(snap=>{
    snap.forEach(d=>{
      if(d.id != me.uid && !excludeIds.includes(d.id)){
        html += `<label style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #2a3942;cursor:pointer;">
          <input type="checkbox" value="${d.id}" onchange="toggleSelect(this)">
          <div class="avatar" style="width:45px;height:45px;font-size:16px;">${getInitials(d.data().name)}</div>
          <span style="font-size:17px;">${d.data().name}</span>
        </label>`;
      }
    });
    document.getElementById("userList").innerHTML = html || "Member tur an awm lo";
    document.getElementById("memberModal").style.display = "flex";
  });
}
function toggleSelect(cb){ if(cb.checked) selectedMembers.push(cb.value); else selectedMembers = selectedMembers.filter(id => id != cb.value); }
function closeMemberModal(){ document.getElementById("memberModal").style.display = "none"; }
function confirmAdd(){ if(selectedMembers.length == 0) return alert("Tu mah i thlang lo"); modalCallback(selectedMembers); closeMemberModal(); }

function newGroup(){
  let name = prompt("Group hming dah rawh:");
  if(!name) return;
  openMemberModal("Group ah telh duh te thlang rawh", (chosen)=>{
    let members = [me.uid, ...chosen];
    db.collection("groups").add({name:name,members:members,admins:[me.uid],createdBy:me.uid,time:Date.now()}).then(()=>alert("Group siam zawh"));
  });
  toggleMenu();
}

function getInitials(name){ return name.split(" ").map(n=>n[0]).join("").toUpperCase().slice(0,2); }

function loadChats(){
  db.collection("users").onSnapshot(snap=>{
    snap.forEach(d=>{
      if(d.id!= me.uid){
        let chatId = [me.uid,d.id].sort().join("_");
        db.collection("privateChats").doc(chatId).collection("messages").orderBy("time","desc").limit(1).onSnapshot(msnap=>{
          let lastText = "Tap to chat"; if(!msnap.empty) lastText = msnap.docs[0].data().text;
          let div = document.getElementById("p-"+d.id); if(!div){ div = document.createElement("div"); div.id = "p-"+d.id; div.className = "item"; div.onclick = ()=>openPrivate(d.id,d.data().name); document.getElementById("chatList").prepend(div); }
          div.innerHTML = `<div class="avatar">${getInitials(d.data().name)}</div><div class="chat-info"><div class="chat-name">${d.data().name}</div><div class="last-msg">${lastText}</div></div>`;
        });
      }
    });
  });
  db.collection("groups").where("members","array-contains",me.uid).onSnapshot(gsnap=>{
    gsnap.forEach(g=>{
      let data = g.data(); let div = document.getElementById("g-"+g.id); if(!div){ div = document.createElement("div"); div.id = "g-"+g.id; div.className = "item"; div.onclick = ()=>openGroup(g.id,data.name); document.getElementById("chatList").prepend(div); }
      div.innerHTML = `<div class="avatar" style="background:#00a884">${getInitials(data.name)}</div><div class="chat-info"><div class="chat-name">${data.name}</div><div class="last-msg">👥 Group</div></div>`;
    });
  });
}

function loadStatus(){ db.collection("status").orderBy("time","desc").onSnapshot(snap=>{ let html=""; snap.forEach(d=>{ let data = d.data(); html+=`<div class="item"><div class="avatar status">${getInitials(data.name)}</div><div class="chat-info"><div class="chat-name">${data.name}</div><div class="last-msg">${data.text}</div></div></div>`; }); document.getElementById("statusList").innerHTML = html || '<div style="padding:25px;text-align:center;color:#8696a0;font-size:17px">Status la awm lo</div>'; }); }
function postStatus(){ let txt=document.getElementById("statusInput").value.trim(); if(!txt) return; db.collection("users").doc(me.uid).get().then(doc=>{ db.collection("status").add({text:txt,name:doc.data().name,time:Date.now()}); document.getElementById("statusInput").value=""; }); }
function openPrivate(uid,name){ localStorage.setItem("chatWith",uid); localStorage.setItem("chatName",name); location.href="chat.html"; }
function openGroup(gid,name){ localStorage.setItem("chatWith",gid); localStorage.setItem("chatName",name); location.href="group.html"; }
document.addEventListener('click', function(e){ if(!e.target.closest('.header')) document.getElementById("menu").classList.remove("show"); });
</script>
</body>
</html>

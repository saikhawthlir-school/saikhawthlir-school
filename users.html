<!DOCTYPE html>
<html>
<head>
  <title>Friends - SKT School</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --bg: #f0f2f5; --card: white; --text: #050505; --sub: #65676b; }
    body.dark { --bg: #18191a; --card: #242526; --text: #e4e6eb; --sub: #b0b3b8; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial; }
    body { background: var(--bg); color: var(--text) }
.header { background: var(--card); padding: 10px 20px; display:flex; justify-content:space-between; align-items:center }
.header h2 { color:#1877f2 }
.header button { background:#1877f2; padding:8px 16px; border-radius:8px; border:none; color:white; font-weight:bold; cursor:pointer }
.container { max-width: 600px; margin: 20px auto; padding: 0 10px; }
.section { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px }
.section h3 { margin-bottom:10px }
.user-card { padding: 10px 0; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--sub) }
.user-card:last-child { border:none }
.avatar { width:40px; height:40px; border-radius:50%; background: linear-gradient(45deg, #1877f2, #42a5f5); display:flex; align-items:center; justify-content:center; color:white; font-weight:bold }
.user-card button { padding:8px 16px; border-radius:8px; border:none; background:#1877f2; color:white; font-weight:bold; cursor:pointer }
.user-card button.decline { background:#f44336; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Friends</h2>
    <button onclick="window.location='feed.html'">Home</button>
  </div>
  <div class="container">
    <div class="section">
      <h3>Friend Requests</h3>
      <div id="requests">Loading...</div>
    </div>
    <div class="section">
      <h3>All Users</h3>
      <div id="userList">Loading...</div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, getDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk", authDomain: "school-project-dab29.firebaseapp.com", projectId: "school-project-dab29" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  if(localStorage.getItem('dark') === 'true') document.body.classList.add('dark');

  onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "login.html"; else { currentUser = user; loadAll(); } });

  window.addFriend = async (targetUid) => {
    await updateDoc(doc(db, "users", targetUid), { requests: arrayUnion(currentUser.uid) });
    alert("Friend request i thawn e"); loadAll();
  }

  window.acceptFriend = async (friendUid) => {
    await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayUnion(friendUid), requests: arrayRemove(friendUid) });
    await updateDoc(doc(db, "users", friendUid), { friends: arrayUnion(currentUser.uid) });
    alert("Friend i nei tawh"); loadAll();
  }

  window.declineFriend = async (friendUid) => {
    await updateDoc(doc(db, "users", currentUser.uid), { requests: arrayRemove(friendUid) });
    alert("Request i decline"); loadAll();
  }

  async function loadAll() {
    const snap = await getDocs(collection(db, "users"));
    const myData = (await getDoc(doc(db, "users", currentUser.uid))).data();

    let reqHtml = "";
    if(myData.requests?.length === 0) reqHtml = "Request a awm lo";
    myData.requests?.forEach(uid => {
      const u = snap.docs.find(d => d.id === uid)?.data();
      if(u) reqHtml += `<div class="user-card"><div style="display:flex; gap:10px; align-items:center"><div class="avatar">${u.name.charAt(0)}</div> ${u.name}</div><div><button onclick="acceptFriend('${uid}')">Accept</button> <button class="decline" onclick="declineFriend('${uid}')">Decline</button></div></div>`;
    });
    document.getElementById('requests').innerHTML = reqHtml;

    let userHtml = "";
    snap.forEach(d => {
      if(d.id === currentUser.uid || myData.friends?.includes(d.id)) return;
      const data = d.data();
      const sent = data.requests?.includes(currentUser.uid);
      userHtml += `<div class="user-card"><div style="display:flex; gap:10px; align-items:center"><div class="avatar">${data.name.charAt(0)}</div> ${data.name}</div><button onclick="addFriend('${d.id}')" ${sent? 'disabled' : ''}>${sent? 'Sent' : 'Add Friend'}</button></div>`;
    });
    document.getElementById('userList').innerHTML = userHtml || "User dang an awm lo";
  }
</script>
</body>
</html>

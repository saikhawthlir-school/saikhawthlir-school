<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKT School Login</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #1877f2; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #aaa; }
    #otp-box { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>SKT School Login</h2>
    <div id="phone-box">
      <input type="text" id="phone" placeholder="+91 70056 97815">
      <div id="recaptcha-container"></div>
      <button id="send-otp">Send OTP</button>
    </div>

    <div id="otp-box">
      <input type="text" id="otp" placeholder="Enter OTP: 123456">
      <button id="verify-otp">Verify & Login</button>
    </div>
    <p id="error" style="color:red;"></p>
  </div>

  <script type="module">
    // 1. Firebase Import
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // 2. I Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
      authDomain: "school-project-dab29.firebaseapp.com",
      projectId: "school-project-dab29",
      storageBucket: "school-project-dab29.appspot.com",
      messagingSenderId: "213425473234",
      appId: "1:213425473234:web:b3f9088a476ef8Be3ce79"
    };

    // 3. Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 4. Recaptcha
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'normal' });

    let confirmationResult;
    const sendBtn = document.getElementById('send-otp');
    const verifyBtn = document.getElementById('verify-otp');

    // 5. Send OTP - TEST MODE: 123456
    sendBtn.onclick = () => {
      const phone = document.getElementById('phone').value;
      signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
        .then((result) => {
          confirmationResult = result;
          document.getElementById('phone-box').style.display = 'none';
          document.getElementById('otp-box').style.display = 'block';
          alert("OTP sent! Test OTP: 123456");
        }).catch((error) => {
          document.getElementById('error').innerText = error.message;
        });
    };

    // 6. Verify OTP
    verifyBtn.onclick = () => {
      const code = document.getElementById('otp').value;
      confirmationResult.confirm(code).then((result) => {
        // Login hlawhtlin chuan feed ah kal
        window.location.href = "feed.html";
      }).catch((error) => {
        document.getElementById('error').innerText = "Wrong OTP";
      });
    };
  </script>
</body>
</html>

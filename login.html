<!DOCTYPE html>
<html>
<head>
  <title>SKT School Login</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
    .box { background: white; padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    h2 { color:#1877f2 }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size:16px; }
    button { background: #1877f2; color: white; border: none; font-weight: bold; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>SKT School Login</h2>
    <input type="email" id="email" placeholder="Email" value="test@test.com">
    <input type="password" id="pass" placeholder="Password" value="123456">
    <button id="login">Login</button>
    <p id="error" style="color:red"></p>
  </div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  
  const app = initializeApp({
    apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
    authDomain: "school-project-dab29.firebaseapp.com",
    projectId: "school-project-dab29"
  });
  const auth = getAuth(app);

  document.getElementById('login').onclick = () => {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    signInWithEmailAndPassword(auth, email, pass)
    .then(() => window.location.href = "feed.html")
    .catch((e) => document.getElementById('error').innerText = "Login failed: " + e.message);
  }
</script>
</body>
</html>

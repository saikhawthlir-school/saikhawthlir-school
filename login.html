<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MizoChat - Login</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family: Roboto, "Segoe UI", sans-serif; background: #FFFFFF; padding: 50px 16px 0; }
  .logo-wrap{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .logo{ width:48px; height:48px; border-radius:12px; background: linear-gradient(135deg,#25D366,#128C7E); display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:18px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); align-self:flex-start; margin-top:4px; flex-shrink:0; }
  h1{ font-size:24px; margin:0; font-weight:700; color:#000; line-height:1.2; }
  .sub{ color:#333; font-size:15px; line-height:1.4; margin-top:2px; margin-bottom:30px; }
  .info{ font-size:15px; color:#000; margin:0 0 14px; }
  .info b{ font-weight:700; }
  .error-box{ display:none; background: #ffebee; color: #c62828; border-left: 4px solid #c62828; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
  .field{ position:relative; margin-bottom:14px; background:white; border:1.5px solid #ddd; border-radius:10px; }
  .field-label{ position:absolute; top:12px; left:14px; font-size:14px; color:#666; font-weight:500; transition: all 0.2s; pointer-events:none; background:white; padding:0 4px; }
  .input{ width:100%; padding:16px 14px 10px; border:none; font-size:16px; background:transparent; outline:none; }
  .input:focus + .field-label, .input:not(:placeholder-shown) + .field-label{ top:-8px; font-size:12px; color:#128C7E; }
  .pw-wrap{ position:relative; }
  .eye{ position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:20px; color:#999; user-select: none; }
  .forgot{ display:block; margin:4px 0 18px; color:#128C7E; text-decoration:none; font-weight:600; font-size:14px; text-align:right; }
  .btn{ width:100%; padding:14px; border:none; border-radius:12px; background: linear-gradient(135deg,#25D366,#128C7E); color:white; font-size:17px; font-weight:700; cursor:pointer; box-shadow: 0 3px 8px rgba(18,140,126,0.3); }
  .btn:active{ transform: scale(0.98); }
  .divider{ height:1px; background:#e5e5e5; margin:18px 0; }
  .register{ text-align:center; font-size:15px; color:#222; }
  .register a{ color:#128C7E; font-weight:700; text-decoration:none; }
</style>
</head>
<body>

<div class="logo-wrap">
  <div class="logo">MC</div>
  <div>
    <h1>Welcome!</h1>
    <div class="sub">Login to your <b>MizoChat</b> Account</div>
  </div>
</div>
 <br><br>

<div class="info">Login using your <b>Email ID and Password</b></div>
<div id="errorBox" class="error-box"></div>

<div class="field">
  <input id="email" class="input" type="email" placeholder=" ">
  <span class="field-label">Email ID *</span>
</div>

<div class="field pw-wrap">
  <input id="pass" class="input" type="password" placeholder=" ">
  <span class="field-label">Password *</span>
  <span class="eye" onclick="togglePass()">👁️</span>
</div>

<a href="forgot.html" class="forgot">Forgot Password?</a>
<button class="btn" onclick="login()">Login</button>

<div class="divider"></div>
<div class="register"> Don't have a MizoChat Account? <a href="signup.html">Register Now</a> </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
const firebaseConfig = { 
  apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
  authDomain: "school-project-dab29.firebaseapp.com", 
  projectId: "school-project-dab29",
  storageBucket: "school-project-dab29.appspot.com",
  messagingSenderId: "214125475324",
  appId: "1:214125475324:web:8f98e8a447ef8bec3a2f79"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// HEIHI KA THLAK - chat.html ni lo in index.html
auth.onAuthStateChanged((user) => {
  if (user) {
    location.href = "index.html"; // CHATS | STATUS | USERS awmna
  }
});

function togglePass(){
  const p = document.getElementById('pass');
  const eye = document.querySelector('.eye');
  if(p.type==='password'){ p.type='text'; eye.textContent = '🙈'; } 
  else { p.type='password'; eye.textContent = '👁️'; }
}

function showError(msg){
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.innerText = msg;
}

function login(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  document.getElementById('errorBox').style.display = 'none';
  
  if(!email || !pass){ showError("Email leh Password dah kim rawh"); return; }
  
  // HEIHI KA THLAK - chat.html ni lo in index.html
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=> location.href="index.html")
    .catch(e=> {
      if(e.code === 'auth/wrong-password'){ showError("Password a dik lo"); } 
      else if(e.code === 'auth/user-not-found'){ showError("He email hmang hian account a awm lo"); } 
      else if(e.code === 'auth/invalid-email'){ showError("Email address a dik lo"); } 
      else if(e.code === 'auth/too-many-requests'){ showError("I try nasa lutuk. Darkar 1 hnu ah han try leh rawh"); } 
      else { showError("Login theih rih lo. Error: " + e.code); }
    });
}
</script>
</body>
</html>

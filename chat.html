<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial; background:#e5ddd5; height:100vh; display:flex; flex-direction:column; }
  header { background:#128C7E; color:white; height:60px; padding:0 12px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
.back-btn { font-size:32px; cursor:pointer; line-height:60px; }
.profile-pic { width:42px; height:42px; border-radius:50%; cursor:pointer; }
.header-info { flex:1; cursor:pointer; }
.header-info.name { font-size:18px; font-weight:600; }
.header-info.status { font-size:13px; opacity:0.9; }
.chat-box { flex:1; padding:10px; overflow-y:auto; padding-bottom:70px; background:#e5ddd5; }
.msg { background:white; padding:8px 12px; border-radius:8px; margin:5px 0; max-width:75%; position:relative; box-shadow:0 1px 0.5px rgba(0,0,0,0.13); word-wrap:break-word; }
.msg.me { background:#DCF8C6; margin-left:auto; }
.msg.time { font-size:11px; color:#667781; text-align:right; margin-top:4px; display:flex; gap:3px; justify-content:flex-end; align-items:center; }
.tick { font-size:14px; }
.tick.read { color:#53bdeb; }
.input-wrap { display:flex; padding:8px; background:#f0f0f0; align-items:center; gap:8px; position:fixed; bottom:0; left:0; right:0; z-index:99; }
.input { flex:1; background:white; border-radius:25px; padding:12px 16px; border:none; outline:none; font-size:15px; }
.send-btn { width:48px; height:48px; border-radius:50%; background:#128C7E; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn svg { fill:white; width:24px; height:24px; }
</style>
</head>
<body>

<header>
  <div class="back-btn" onclick="window.location.href='index.html'">←</div>
  <img class="profile-pic" id="friendPic" src="https://i.pravatar.cc/42">
  <div class="header-info">
    <div class="name" id="friendName">Loading...</div>
    <div class="status" id="friendStatus">Offline</div>
  </div>
</header>

<div class="chat-box" id="chatBox"></div>

<div class="input-wrap">
  <input type="text" id="msgInput" class="input" placeholder="Type a message" onkeydown="if(event.key==='Enter') sendMsg()">
  <button class="send-btn" onclick="sendMsg()">
    <svg viewBox="0 0 24 24"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",
  authDomain: "school-project-dab29.firebaseapp.com",
  projectId: "school-project-dab29"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const friendUid = urlParams.get('uid');
if(!friendUid) window.location.href = "index.html";

let currentUser = null;
let chatId = null;

auth.onAuthStateChanged((user) => {
  if (!user) return window.location.href = "login.html";
  currentUser = user;
  chatId = [currentUser.uid, friendUid].sort().join("_");
  loadFriendInfo();
  loadMessages();
  markAsRead();
});

function loadFriendInfo(){
  db.collection("users").doc(friendUid).get().then((doc) => {
    if(doc.exists){
      const data = doc.data();
      let nameToShow = data.name || (data.email? data.email.split('@')[0] : "User");
      document.getElementById('friendName').innerText = nameToShow;
      document.getElementById('friendPic').src = data.photoURL || 'https://i.pravatar.cc/42';
      document.getElementById('friendStatus').innerText = data.status || 'Offline';
    }
  });
}

function getTicks(status){
  if(status === 'read') return `<span class="tick read">✓✓</span>`;
  if(status === 'delivered') return `<span class="tick">✓✓</span>`;
  return `<span class="tick">✓</span>`;
}

function loadMessages(){
  db.collection("chats").doc(chatId).collection("messages").orderBy("timestamp")
.onSnapshot((snapshot) => {
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = "";
    let lastMsg = null;
    snapshot.forEach(doc => {
      const msg = doc.data();
      lastMsg = msg;
      const isMe = msg.senderId === currentUser.uid;
      const time = msg.timestamp? new Date(msg.timestamp.toDate()).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}) : '';
      const ticks = isMe? getTicks(msg.status) : '';
      chatBox.innerHTML += `<div class="msg ${isMe? 'me' : ''}">${msg.text}<div class="time">${time} ${ticks}</div></div>`;
    });
    chatBox.scrollTop = chatBox.scrollHeight;

    if(lastMsg){
      updateChatList(lastMsg);
    }
  });
}

// PAWIMAWH: CHAT LIST UPDATE + senderId DAH TEL
function updateChatList(lastMsg){
  const dataForMe = {
    lastMessage: lastMsg.text,
    timestamp: lastMsg.timestamp,
    friendUid: friendUid,
    status: lastMsg.status,
    senderId: lastMsg.senderId // tunge thawn hriat nan
  };
  const dataForFriend = {
    lastMessage: lastMsg.text,
    timestamp: lastMsg.timestamp,
    friendUid: currentUser.uid,
    status: lastMsg.senderId === currentUser.uid? 'sent' : lastMsg.status, // keima thawn loh chuan a status ang
    senderId: lastMsg.senderId
  };

  db.collection("userChats").doc(currentUser.uid).collection("chats").doc(friendUid).set(dataForMe, {merge: true});
  db.collection("userChats").doc(friendUid).collection("chats").doc(currentUser.uid).set(dataForFriend, {merge: true});
}

function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text ||!currentUser ||!chatId ||!friendUid) return;

  db.collection("chats").doc(chatId).collection("messages").add({
    text: text,
    senderId: currentUser.uid,
    receiverId: friendUid,
    status: 'sent', // 1 tick
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  input.value = "";
}

function markAsRead(){
  // Kei hnena lo thleng chu hawng apiangin 'read' ah
  db.collection("chats").doc(chatId).collection("messages")
.where("receiverId", "==", currentUser.uid)
.where("status", "in", ["sent","delivered"])
.get().then(snap => {
    snap.forEach(doc => doc.ref.update({status: 'read'}))
  })

  // 'sent' chu 'delivered' ah
  db.collection("chats").doc(chatId).collection("messages")
.where("receiverId", "==", currentUser.uid)
.where("status", "==", "sent")
.onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      if(change.type === 'added') change.doc.ref.update({status: 'delivered'})
    })
  })
}
</script>
</body>
</html>

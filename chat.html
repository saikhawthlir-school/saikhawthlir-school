<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  body { margin:0; font-family:Arial; background:#e5ddd5; display:flex; flex-direction:column; height:100vh; }
  header { background:#128C7E; color:white; padding:12px; display:flex; align-items:center; }
  header button { background:none; border:none; color:white; font-size:24px; margin-right:10px; cursor:pointer; }
  header img { width:40px; height:40px; border-radius:50%; margin-right:10px; }
  .chat-box { flex:1; padding:10px; overflow-y:auto; }
  .msg { background:white; padding:8px 12px; border-radius:8px; margin:5px 0; max-width:70%; }
  .msg.me { background:#DCF8C6; margin-left:auto; }
  .input { display:flex; padding:10px; background:white; }
  .input input { flex:1; padding:12px; border-radius:20px; border:1px solid #ccc; outline:none; }
  .input button { margin-left:10px; padding:10px 20px; background:#128C7E; color:white; border:none; border-radius:20px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <button onclick="history.back()">←</button>
  <img src="https://i.pravatar.cc/40" id="friendPic">
  <b id="friendName">Loading...</b>
</header>

<div class="chat-box" id="chatBox">
  <p style="text-align:center; color:#666;">Message system kan la dah lo</p>
</div>

<div class="input">
  <input type="text" id="msgInput" placeholder="Type a message">
  <button onclick="sendMsg()">Send</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey:"AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain:"school-project-dab29.firebaseapp.com",projectId:"school-project-dab29"});
  const auth = getAuth();
  const db = getFirestore();

  const urlParams = new URLSearchParams(window.location.search);
  const friendUid = urlParams.get('uid');

  onAuthStateChanged(auth, async (user) => {
    if (!user) window.location.href = "login.html";
    if(friendUid) {
      const userDoc = await getDoc(doc(db, "users", friendUid));
      if(userDoc.exists()){
        const data = userDoc.data();
        document.getElementById('friendName').innerText = data.name || data.email;
        document.getElementById('friendPic').src = data.photoURL || 'https://i.pravatar.cc/40';
      }
    }
  });

  window.sendMsg = () => {
    alert("Message thawn na hi a hnu ah kan dah dawn nia boss. Tun ah chuan hming chiah a lang thei rih");
  }
</script>
</body>
</html>

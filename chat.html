<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b141a;color:white;font-family:'Segoe UI',Arial;height:100vh;display:flex;flex-direction:column;font-size:45px;}
.header{background:#202c33;padding:28px 24px;font-weight:600;position:sticky;top:0;display:flex;gap:20px;align-items:center;font-size:46px;z-index:10;}
.header button{background:none;border:none;color:white;font-size:50px;cursor:pointer;}
#chatBox{flex:1;overflow-y:auto;padding:20px;background-image:url('https://user-images.githubusercontent.com/15082520/120515973-9b1ff200-c3b8-11eb-8b1e-5c1c7d5a3b3e.png');background-size:contain;}
.msg{
  background:#202c33;
  padding:24px 28px;
  margin:12px 0;
  border-radius:12px;
  max-width:80%;
  font-size:38px;
  word-wrap:break-word;
  line-height:1.4;
}
.msg.me{background:#005c4b;margin-left:auto;}
.bottom{position:sticky;bottom:0;display:flex;background:#202c33;padding:18px;gap:14px;}
input{flex:1;padding:28px 30px;border:none;border-radius:35px;background:#2a3942;color:white;font-size:36px;}
button{padding:28px 30px;background:#00a884;color:#111b21;border:none;border-radius:50%;font-size:40px;cursor:pointer;}
</style></head>
<body>
<div class="header"><button onclick="location.href='users.html'">←</button><span id="headerName"></span></div>
<div id="chatBox"></div>
<div class="bottom"><input id="msgInput" placeholder="Message type rawh..." onkeypress="if(event.key==='Enter') send()"><button onclick="send()">➤</button></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey: "AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain: "school-project-dab29.firebaseapp.com",projectId: "school-project-dab29"};
firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
let me=null; let chatWith=localStorage.getItem("chatWith"); let chatName=localStorage.getItem("chatName");
document.getElementById("headerName").innerText = chatName;
auth.onAuthStateChanged(u=>{ if(!u) location.href="index.html"; me=u; loadMessages(); });
function loadMessages(){ let chatId = [me.uid, chatWith].sort().join("_"); db.collection("privateChats").doc(chatId).collection("messages").orderBy("time").onSnapshot(snap=>{ let html=""; snap.forEach(d=>{ let data=d.data(); let cls = data.uid==me.uid ? "msg me" : "msg"; html+=`<div class="${cls}">${data.text}</div>`; }); document.getElementById("chatBox").innerHTML = html; document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight; }); }
function send(){ let txt=document.getElementById("msgInput").value.trim(); if(!txt) return; let chatId = [me.uid, chatWith].sort().join("_"); db.collection("privateChats").doc(chatId).collection("messages").add({text:txt,uid:me.uid,time:Date.now()}); document.getElementById("msgInput").value=""; }
</script></body></html>

<script>
// Page load apiang in font size saved kha a apply nghal
window.onload = function(){
  let savedSize = localStorage.getItem("appFontSize") || 45;
  document.body.style.fontSize = savedSize + "px";
}
</script>

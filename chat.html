<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial; background:#e5ddd5; height:100vh; display:flex; flex-direction:column; }

  /* HEADER FIX - A LAI TAK AH A AWM ANG */
  header { 
    background:#128C7E; color:white; 
    height:60px; padding:0 12px; 
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:100;
  }
  .back-btn { 
    font-size:32px; cursor:pointer; line-height:60px;
  }
  .profile-pic { 
    width:42px; height:42px; border-radius:50%; cursor:pointer;
  }
  .header-info { flex:1; cursor:pointer; }
  .header-info .name { font-size:18px; font-weight:600; }
  .header-info .status { font-size:13px; opacity:0.9; }

  /* CHAT BOX */
  .chat-box { 
    flex:1; padding:10px; overflow-y:auto; 
    padding-bottom:70px; /* input tan hmun dah */
    background:#e5ddd5;
  }
  .msg { 
    background:white; padding:8px 12px; border-radius:8px; 
    margin:5px 0; max-width:75%; position:relative;
    box-shadow:0 1px 0.5px rgba(0,0,0,0.13); word-wrap:break-word;
  }
  .msg.me { background:#DCF8C6; margin-left:auto; }
  .msg .time { font-size:11px; color:#667781; text-align:right; margin-top:4px; }

  /* INPUT FIX - A LANG RENG ANG */
  .input-wrap { 
    display:flex; padding:8px; background:#f0f0f0; 
    align-items:center; gap:8px;
    position:fixed; bottom:0; left:0; right:0;
    z-index:99;
  }
  .input { 
    flex:1; background:white; border-radius:25px; 
    padding:12px 16px; border:none; outline:none; font-size:15px;
  }
  .send-btn { 
    width:48px; height:48px; border-radius:50%; 
    background:#128C7E; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .send-btn svg { fill:white; width:24px; height:24px; }
</style>
</head>
<body>

<header>
  <div class="back-btn" onclick="history.back()">←</div>
  <img class="profile-pic" id="friendPic" onclick="goProfile()">
  <div class="header-info" onclick="goProfile()">
    <div class="name" id="friendName">Loading...</div>
    <div class="status" id="friendStatus">Offline</div>
  </div>
</header>

<div class="chat-box" id="chatBox"></div>

<div class="input-wrap">
  <input type="text" id="msgInput" class="input" placeholder="Type a message" onkeydown="if(event.key==='Enter') sendMsg()">
  <button class="send-btn" onclick="sendMsg()">
    <svg viewBox="0 0 24 24"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg>
  </button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey:"AIzaSyDR_nEYUlimYLcU9dc3diXrt7_IV2xzqRk",authDomain:"school-project-dab29.firebaseapp.com",projectId:"school-project-dab29"});
  const auth = getAuth();
  const db = getFirestore();

  const urlParams = new URLSearchParams(window.location.search);
  const friendUid = urlParams.get('uid');
  let currentUser = null;
  let chatId = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location.href = "login.html";
    currentUser = user;
    if(friendUid) {
      chatId = [currentUser.uid, friendUid].sort().join("_");
      loadFriendInfo();
      loadMessages();
    }
  });

  async function loadFriendInfo(){
    if(!friendUid) return;
    const userDoc = await getDoc(doc(db, "users", friendUid));
    if(userDoc.exists()){
      const data = userDoc.data();
      document.getElementById('friendName').innerText = data.name || data.email;
      document.getElementById('friendPic').src = data.photoURL || 'https://i.pravatar.cc/42';
      document.getElementById('friendStatus').innerText = data.status || 'Offline';
    }
  }

  function loadMessages(){
    if(!chatId) return;
    const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp"));
    onSnapshot(q, (snapshot) => {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = "";
      snapshot.forEach(doc => {
        const msg = doc.data();
        const isMe = msg.senderId === currentUser.uid;
        const time = msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}) : '';
        chatBox.innerHTML += `<div class="msg ${isMe ? 'me' : ''}">${msg.text}<div class="time">${time}</div></div>`;
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }, (error) => {
      console.error("Load Messages Error:", error);
      alert("Message load Error: " + error.message);
    });
  }

  window.sendMsg = async () => {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text || !currentUser || !chatId || !friendUid) return; // Heihi ka belh
    
    try {
      await addDoc(collection(db, "chats", chatId, "messages"), {
        text: text,
        senderId: currentUser.uid,
        receiverId: friendUid,
        timestamp: serverTimestamp()
      });
      input.value = "";
    } catch(e) {
      console.error("Send Error:", e);
      alert("Error: " + e.message) // Error a awm chuan a rawn lang ang
    }
  }

  window.goProfile = () => {
    if(friendUid) window.location.href = `profile.html?uid=${friendUid}`;
  }
</script>
</body>
</html>
